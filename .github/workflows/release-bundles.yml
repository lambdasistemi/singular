name: Release bundles
# The release artifacts of every platform (#695, #707), at the organisation's
# binary distribution standard (the dev-assets helpers and actions): the
# relocatable bundles of singular, open-datum and the development node, built
# from the flake's release-bundle output and smoke-tested on their own platform
# from the extracted tarball; for Linux an AppImage per command and one DEB and
# one RPM with every command, smoke-tested extracted and installed on machines
# without Nix; for macOS the Homebrew formula, installed from a local tap on a
# pull request. The bundle job builds and smoke-tests; the jobs after it play
# what it produced (#747): the registration journey from the unpacked Linux
# bundle and from the installed Debian package on machines without Nix, and the
# release assembled from the built bundles verified as a tag run verifies the
# published one. Nothing here
# publishes on a pull request, a push to main or the tag run that calls this
# one (the release workflow publishes what it uploaded); a manual run with
# dev_channels publishes the dev channels (dev-linux assets, the singular-dev
# formula).
on:
  pull_request:
    branches: [main, 'epic/**']
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      dev_channels:
        description: "Publish the dev channels: the dev-linux release assets and the singular-dev formula"
        type: choice
        options: ["no", "yes"]
        default: "no"
permissions:
  contents: read
concurrency:
  group: release-bundles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Release bundle scope
    runs-on: ubuntu-24.04
    outputs:
      bundles: ${{ steps.scope.outputs.bundles }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Decide whether the bundles are built
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Every non-pull-request run builds the bundles"
            echo "bundles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "origin/${BASE}...HEAD")"
          printf 'Changed files:\n%s\n' "$files"
          pattern='^(\.github/workflows/(release|release-bundles|sync-cabal-version)\.yml|flake\.(nix|lock)|nix/|version\.txt|tools/(release_bundle|verify_release_bundles|cabal_versions)|offchain/(flake\.(nix|lock)|nix/|data/contracts/|[^/]*\.cabal)|applications/open-datum/offchain/(flake\.(nix|lock)|nix/|[^/]*\.cabal))'
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "bundles=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release or packaging file changed: the bundles are not built"
            echo "bundles=false" >> "$GITHUB_OUTPUT"
          fi
  bundle:
    needs: changes
    if: needs.changes.outputs.bundles == 'true'
    name: Release bundle (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: nixos
          - system: aarch64-darwin
            runner: macos-14
    env:
      SYSTEM: ${{ matrix.system }}
      # a tag run builds and checks the release outputs; every other run the dev ones
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - name: Isolate Nix cache
        if: runner.os == 'Linux'
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-bundle"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - name: Free runner disk
        if: runner.os == 'macOS'
        run: |
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/Library/Android 2>/dev/null || true
          df -h /
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The self-hosted runner carries Nix and reads and writes the cache; a
      # GitHub-hosted macOS machine gets both from the shared setup action,
      # which pushes what it builds so the next run starts warm.
      - uses: cachix/cachix-action@v17
        if: runner.os == 'Linux'
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: paolino/dev-assets/setup-nix@03598aca12f569acb7c21556806b16887272634b
        if: runner.os == 'macOS'
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the bundle
        run: nix build --quiet --print-out-paths --out-link bundle .#release-bundle
      - name: Print the release and commit through the Nix route
        run: |
          version="$(cat version.txt)"
          commit="$(git rev-parse HEAD)"
          singular_line="$(nix run --quiet .#singular -- --version)"
          open_datum_line="$(nix run --quiet .#open-datum -- --version)"
          printf '%s\n' "$singular_line" "$open_datum_line"
          [ "$singular_line" = "singular ${version} (commit ${commit})" ]
          [ "$open_datum_line" = "open-datum ${version} (commit ${commit})" ]
      - name: Smoke-test the bundle on this platform
        run: |
          version="$(cat version.txt)"
          commit="$(git rev-parse HEAD)"
          mkdir -p dist
          cp -L "bundle/singular-${version}-${SYSTEM}.tar.gz" dist/
          tarball="dist/singular-${version}-${SYSTEM}.tar.gz"
          # the platform smoke, its controls and the controls of the check a
          # published release's bundles pass, with the tools they need carried
          # by the app, not read from the runner
          nix run --quiet .#release-bundle-checks -- "$tarball" "$version" "$commit"
      # #707: the Linux packages of the distribution standard: an AppImage per
      # command, one DEB and one RPM with every command, each smoke-tested from
      # its extracted form with --version, kept as a workflow artifact for the
      # install test below. A manual run publishes nothing here (see dev-channels).
      - name: Linux packages
        if: runner.os == 'Linux' && github.event_name != 'workflow_dispatch'
        uses: paolino/dev-assets/linux-release@ecc41cee5d4c18ac4a8a2527c07cf33cba300a11
        with:
          mode: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev-linux' }}
          tag: ${{ env.RELEASE_TAG }}
          publish: "no"
          release-output: linux-release-artifacts
          dev-output: linux-dev-release-artifacts
          executable-name: singular
          commands: singular,open-datum,devnet
          smoke-args: --version
          usage-grep: "(commit "
          dev-tag: dev-linux
          release-version-command: cat version.txt
          retention-days: "7"
      # #707: the Homebrew formula of the distribution standard, built from this
      # macOS bundle, the tarball smoked unpacked and, on a pull request,
      # installed through a local tap pointing at it and tested with brew test.
      - name: Homebrew formula
        if: runner.os == 'macOS' && github.event_name != 'workflow_dispatch'
        uses: paolino/dev-assets/darwin-homebrew-release@ecc41cee5d4c18ac4a8a2527c07cf33cba300a11
        with:
          mode: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'dev-homebrew' }}
          tag: ${{ env.RELEASE_TAG }}
          publish: "no"
          release-formula: singular.rb
          dev-formula: singular-dev.rb
          tarball-pattern: "singular-*-aarch64-darwin.tar.gz"
          installed-commands: singular open-datum devnet
          cleanup-formulae: singular singular-dev
          tap-name: lambdasistemi/tap
          tap-repository: lambdasistemi/homebrew-tap
          tarball-smoke-script: |
            singular --version
            open-datum --version
            devnet --version
          brew-smoke-script: |
            singular --version
            open-datum --version
            devnet --version
          retention-days: "7"
      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ matrix.system }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  # #707: the Linux packages as a user meets them: the DEB installed on Ubuntu,
  # the RPM on Fedora and each AppImage run, on machines without Nix, every
  # command run from where the package put it.
  install:
    needs: [changes, bundle]
    if: needs.changes.outputs.bundles == 'true' && github.event_name != 'workflow_dispatch'
    name: Linux packages installed on machines without Nix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Name the packages this run built
        id: names
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version="$(cat version.txt)"
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "artifact=linux-release-bundles-singular" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            echo "artifact=linux-dev-release-bundles-singular" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the Linux packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ runner.temp }}/packages
      - name: Install and run every package
        uses: paolino/dev-assets/linux-install-test@ecc41cee5d4c18ac4a8a2527c07cf33cba300a11
        with:
          artifacts-dir: ${{ runner.temp }}/packages
          artifact-version: ${{ steps.names.outputs.version }}
          executable-name: singular
          commands: singular,open-datum,devnet
          smoke-args: --version
          usage-grep: "(commit "
          # the blueprint and the release number beside it, where the packages put them
          expect-files: /usr/share/singular/plutus.json /usr/share/singular/version.txt
  # #747: the registration journey played from the release's own files, as a
  # user with only the release plays it: the Linux bundle unpacked, and the
  # Debian package installed with apt, on a machine that has no Nix. The
  # commands, the blueprint and the development node come from those files
  # alone, and the job shows where each resolved to; the journey and the chain
  # view that judge them come from this checkout. Every verdict is computed from
  # the chain's record or from files and none is typed; create, register,
  # update, terminate, read and the discovered batch fold are each judged from
  # the chain's record and shown failing on altered input. The verdict table,
  # the creation measurement and the receipts are kept whatever the outcome.
  journey:
    needs: [changes, bundle]
    if: needs.changes.outputs.bundles == 'true' && github.event_name != 'workflow_dispatch'
    name: Installed journey (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [tarball, deb]
    env:
      LEG: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The machine has no Nix
        run: |
          if command -v nix; then echo "the machine has a nix"; exit 1; fi
          if [ -e /nix ]; then echo "the machine has a /nix"; exit 1; fi
          printf 'WORK=%s\n' "$RUNNER_TEMP/installed-journey-$LEG" >> "$GITHUB_ENV"
      - name: Download the Linux bundle
        if: matrix.leg == 'tarball'
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-x86_64-linux
          path: ${{ runner.temp }}/bundle
      - name: Download the Linux packages
        if: matrix.leg == 'deb'
        uses: actions/download-artifact@v8
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux-release-bundles-singular' || 'linux-dev-release-bundles-singular' }}
          path: ${{ runner.temp }}/packages
      - name: Install the Debian package
        if: matrix.leg == 'deb'
        run: |
          set -- "$RUNNER_TEMP"/packages/singular-*-x86_64-linux.deb
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one Debian package, found: $*"; exit 1; }
          sudo apt-get install -y -q "$1"
      - name: Play the journey from the release's files
        run: |
          case "$LEG" in
            tarball) bash tools/installed_journey.sh tarball "$RUNNER_TEMP/bundle/singular-$(cat version.txt)-x86_64-linux.tar.gz" "$WORK" ;;
            deb) bash tools/installed_journey.sh package "$WORK" ;;
          esac
      - name: Keep the verdicts, the measurement and the receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-journey-${{ matrix.leg }}
          path: |
            ${{ env.WORK }}/provenance.txt
            ${{ env.WORK }}/journey/verdicts.md
            ${{ env.WORK }}/journey/creation-measurement.json
            ${{ env.WORK }}/journey/receipt.md
            ${{ env.WORK }}/journey/receipts
          if-no-files-found: warn
          retention-days: 7
  # #747: the verifier a tag run applies to the published release, applied
  # beforehand to the release this run assembled and the bundles it built. The
  # release is assembled as the pipeline does (`release-artifacts`), both
  # bundles are added to it and to its SHA256SUMS, and `verify-release` checks
  # it: the sums, the model revision, the members, the bundle checks, the
  # archive's own builds and the registration journey played from the
  # downloaded bundle of this platform. The refusal control of that journey
  # (a bundle that names its release and then fails every command) runs
  # against the same bundles.
  verify:
    needs: [changes, bundle]
    if: needs.changes.outputs.bundles == 'true' && github.event_name != 'workflow_dispatch'
    name: Release verified from its built bundles
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-verify"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Download the bundles of every platform
        uses: actions/download-artifact@v8
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/bundles
      - name: Assemble the release as the pipeline does, and add its bundles
        run: |
          version="$(cat version.txt)"
          TAG_COMMIT="$(git rev-parse HEAD)" nix run --quiet .#release-artifacts -- "$RUNNER_TEMP/release"
          cp -r "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-with-bundles"
          cp "$RUNNER_TEMP/bundles/singular-$version-"*.tar.gz "$RUNNER_TEMP/release-with-bundles/"
          (cd "$RUNNER_TEMP/release-with-bundles" \
            && sha256sum "singular-docs-$version.tar.gz" "singular-onchain-$version.tar.gz" "singular-$version-"*.tar.gz >SHA256SUMS)
          cat "$RUNNER_TEMP/release-with-bundles/SHA256SUMS"
      - name: Verify the release with its bundles
        run: |
          VERIFY_RELEASE_TAG_COMMIT="$(git rev-parse HEAD)" nix run --quiet .#verify-release -- \
            --assets "$RUNNER_TEMP/release-with-bundles" --work "$RUNNER_TEMP/verify-work" "v$(cat version.txt)"
      - name: A bundle whose commands fail the journey is refused
        run: nix run --quiet .#verify-release-controls -- "$RUNNER_TEMP/release" --bundles "$RUNNER_TEMP/bundles"
      - name: Keep the verdicts, the measurement and the receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-release-journey
          path: |
            ${{ runner.temp }}/verify-work/journey/verdicts.md
            ${{ runner.temp }}/verify-work/journey/creation-measurement.json
            ${{ runner.temp }}/verify-work/journey/receipt.md
            ${{ runner.temp }}/verify-work/journey/receipts
          if-no-files-found: warn
          retention-days: 7
  dev-channels:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && inputs.dev_channels == 'yes'
    name: Dev channels (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: nixos
          - system: aarch64-darwin
            runner: macos-14
    steps:
      - name: Isolate Nix cache
        if: runner.os == 'Linux'
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-dev"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - name: Free runner disk
        if: runner.os == 'macOS'
        run: sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/Library/Android 2>/dev/null || true
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        if: runner.os == 'Linux'
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: paolino/dev-assets/setup-nix@03598aca12f569acb7c21556806b16887272634b
        if: runner.os == 'macOS'
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Publish the dev-linux assets
        if: runner.os == 'Linux'
        uses: paolino/dev-assets/linux-release@ecc41cee5d4c18ac4a8a2527c07cf33cba300a11
        with:
          mode: dev-linux
          release-output: linux-release-artifacts
          dev-output: linux-dev-release-artifacts
          executable-name: singular
          commands: singular,open-datum,devnet
          smoke-args: --version
          usage-grep: "(commit "
          dev-tag: dev-linux
          dev-release-title: singular dev Linux packages
          release-version-command: cat version.txt
          github-token: ${{ github.token }}
      - name: Mint a token for the Homebrew tap alone
        if: runner.os == 'macOS'
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: homebrew-tap
          permission-contents: write
      - name: Publish the singular-dev formula
        if: runner.os == 'macOS'
        uses: paolino/dev-assets/darwin-homebrew-release@ecc41cee5d4c18ac4a8a2527c07cf33cba300a11
        with:
          mode: dev-homebrew
          update-tap: "yes"
          dev-tag: dev-homebrew
          release-formula: singular.rb
          dev-formula: singular-dev.rb
          tarball-pattern: "singular-*-aarch64-darwin.tar.gz"
          installed-commands: singular open-datum devnet
          cleanup-formulae: singular singular-dev
          tap-name: lambdasistemi/tap
          tap-repository: lambdasistemi/homebrew-tap
          dev-release-title: singular dev Homebrew
          brew-smoke-script: |
            singular --version
            open-datum --version
            devnet --version
          github-token: ${{ github.token }}
          tap-token: ${{ steps.tap-token.outputs.token }}
  bundles:
    name: Release bundles
    needs: [changes, bundle, install, journey, verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every bundle was built and tested, or none was needed
        env:
          SCOPE: ${{ needs.changes.result }}
          BUNDLES: ${{ needs.bundle.result }}
          INSTALL: ${{ needs.install.result }}
          JOURNEY: ${{ needs.journey.result }}
          VERIFY: ${{ needs.verify.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "scope=$SCOPE bundles=$BUNDLES install=$INSTALL journey=$JOURNEY verify=$VERIFY event=$EVENT"
          [ "$SCOPE" = success ] || { echo "the scope decision did not succeed"; exit 1; }
          for result in "$BUNDLES" "$INSTALL" "$JOURNEY" "$VERIFY"; do
            case "$result" in
              success | skipped) ;;
              *) echo "a bundle check did not pass: $result"; exit 1 ;;
            esac
          done
          # The install test, the installed journey and the verified release run
          # with the bundles, except on a manual run, which builds no packages.
          if [ "$EVENT" != workflow_dispatch ]; then
            [ "$BUNDLES" = "$INSTALL" ] \
              || { echo "the install test disagrees: $BUNDLES $INSTALL"; exit 1; }
            [ "$BUNDLES" = "$JOURNEY" ] \
              || { echo "the installed journey disagrees: $BUNDLES $JOURNEY"; exit 1; }
            [ "$BUNDLES" = "$VERIFY" ] \
              || { echo "the verified release disagrees: $BUNDLES $VERIFY"; exit 1; }
          fi
          case "$BUNDLES" in
            success) echo "every bundle and package was built and tested, the journey played from the release's files, the release verified from its bundles" ;;
            skipped) echo "no release or packaging file changed" ;;
          esac
