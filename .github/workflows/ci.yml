name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'epic/**']
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-gate:
    if: github.event.action != 'closed'
    name: Build Gate
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet .#build-gate
  offchain-lint:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Off-chain lint
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: (cd offchain && nix run --quiet .#lint)
  offchain-component-build:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Off-chain component build
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #264 (epic answers A-005, A-008/A-009/A-010): the classified
      # supported component build carrier. EVERY declared Cabal component is
      # classified in offchain/nix/component-inventory.nix — built here, or
      # explicitly unverified with its owning issue (retired Naming Your Assets journeys,
      # retained executables and their repairs). That file, and the manifest
      # shipped in this build's output, are the single authority for the
      # complete row set; this comment deliberately does not restate the
      # list. Every unverified component stays declared and exported, and no
      # job claims it works. The carrier's inventory gate fails this job on
      # an unclassified or unrecognized new stanza, a stale row, a row
      # without an issue/reason, or an empty set; a member build failure
      # fails it too. Green covers exactly the classified members, never the
      # whole package — build only, nothing executes.
      - run: nix build --quiet .#component-build
        working-directory: offchain
      # #528 slice 4: the registry/application separation pair replaces the
      # retired application-boundary pair. These steps run at the repository
      # root: the check scans the registry trees named in its own data list
      # and the application trees' reach, and the controls plant a naming,
      # a reach, a dependency and the script hash in scratch copies. The
      # S1b form reruns both under nix-and-git-only PATH, proving the
      # wrappers carry every tool they call.
      - run: nix run --quiet .#application-separation-check
      - run: nix run --quiet .#application-separation-controls
      - run: >-
          env -i HOME="$HOME" PATH="$(dirname "$(readlink -f "$(command -v nix)")"):$(dirname "$(readlink -f "$(command -v git)")")" nix run --quiet .#application-separation-check && env -i HOME="$HOME" PATH="$(dirname "$(readlink -f "$(command -v nix)")"):$(dirname "$(readlink -f "$(command -v git)")")" nix run --quiet .#application-separation-controls
  registry-test-vectors:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Registry test vectors
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562 item 8: the offchain cage-test-vectors check executes the
      # registry test-vectors binary (its JSON mode) inside the check
      # derivation, so building the check is the hosted execution. No
      # existing job runs that body: the Cage vectors job in registry.yml
      # runs the --aiken mode through the vectors-check wrapper, a
      # different invocation of the same binary. The off-chain component
      # build job above stays build-only by its own contract, which is
      # why this executing check is its own job. Thirty minutes: the
      # check body itself runs in seconds (7 s measured warm); the budget
      # covers a cold compile of the package the binary comes from.
      - run: nix build --quiet --no-link .#checks.x86_64-linux.cage-test-vectors
        working-directory: offchain
  open-datum-component-build:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Open-datum component build
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #528 slice 4: the application's own component build and lint,
      # from the application's tree, mirroring offchain-component-build.
      - run: cd applications/open-datum/offchain && nix build --quiet .#component-build
      - run: cd applications/open-datum/offchain && nix run --quiet .#lint
  open-datum-tests:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Open-datum tests
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #528 slice 4: the application's whole suite, as the journey job
      # runs cage-tests whole.
      - run: cd applications/open-datum/offchain && nix run --quiet .#open-datum-tests
  open-datum-singular-smoke:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Open-datum registry command line
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562: the application tree's registry command line is an
      # obligation with no other carrier, so it keeps a job of its own:
      # this step runs the exact app with a no-effect invocation (the
      # command list, no node, no state), and that run line is what hosts
      # applications/open-datum/offchain#singular in the census. Thirty
      # minutes: the invocation itself runs in about 22 s warm; the
      # budget covers a cold compile of the registry package it comes
      # from, like the neighbouring component build.
      - run: nix run --quiet .#singular -- --help
        working-directory: applications/open-datum/offchain
  model:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Lean model and exact statement debt
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#model-check
  simulator:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Simulator corpus parity and controls
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#simulator-check
  browser:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Simulator browser checks
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#browser-check
  inventory:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Code inventory
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #278 slice 1: the machine-checked code inventory. This job runs the
      # inventory over the NIX FLAKE SOURCE — a store copy with no .git
      # directory — which is one of the two contexts the inventory must
      # reproduce; the tracked-checkout context runs hosted as the baseline
      # of the Refuse unclassified sources step below (the controls script
      # first inventories the real checkout, as `just inventory` does) and
      # locally via `just inventory` inside local `just ci`.
      # The inventory maps every discovered file to a lint and a format
      # policy (or a named non-code class), fails closed on anything unmapped,
      # and reports enforced versus pending extents honestly — the test-tag
      # controls run in the inventory-check step above, and the orphan
      # controls proving each discovery signal run in the Refuse
      # unclassified sources step below (`nix run .#inventory-controls`).
      - run: nix run --quiet .#inventory-check
      # #562 item 5a: the inventory orphan controls only (the test-tag
      # controls already run inside inventory-check above). The step refuses
      # unclassified sources with their intended diagnostics.
      - name: Refuse unclassified sources
        run: nix run --quiet .#inventory-controls
  workflow-commands-resolve:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Workflow commands resolve and controls
    runs-on: nixos
    timeout-minutes: 25
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562 item 1: the workflow command resolver and its controls. The
      # controls script first resolves the clean tree, then plants a missing
      # app and a missing package and requires both refused. One job covers
      # the check and its controls; the clean run's summary reaches the log.
      - run: nix run --quiet .#workflow-commands-resolve-controls
  declared-checks-hosted:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Declared checks are hosted
    runs-on: nixos
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562 item 20: the declared-checks-hosted census. Every app and
      # check a repository flake declares is named by a workflow step, or
      # carries a reasoned entry in tools/declared_checks_not_hosted.list.
      # The table-driven controls run first (pure classifier cases plus
      # offline fixture flakes, seconds); then the live census evaluates
      # every tracked flake once and classifies the real tree. The issue-state query is read-only
      # (the job's permissions add nothing but issues read); the census
      # fails on a pending-wiring entry whose issue is closed, and the
      # slice that hosts the wired job removes the entry. Timeout from the
      # measured live run (about 120 s warm: the flake evaluations dominate).
      - run: nix run --quiet .#declared-checks-classify-controls
      # The issue-state query is a repository app (its executables declared
      # in the flake, never an inline registry command): it reads the
      # pending-issue numbers from the exception list and answers each with
      # a read-only query. GH_TOKEN binds the job's read-only workflow
      # token explicitly; without it the query fails setup, never a verdict.
      - name: Read the states of the issues the exception list names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run --quiet .#declared-checks-issue-states "$RUNNER_TEMP/issue-states.txt"
      - run: nix run --quiet .#declared-checks-hosted "$RUNNER_TEMP/issue-states.txt"
  registry-cli-build-graph:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Registry CLI build graph
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562 item 2: the registry CLI build-graph check and its controls.
      # Each app first fetches the pinned git sources as setup (exit 2 on
      # failure, never a verdict), then runs its script; the controls refuse
      # both plants with exit 1 naming the offender.
      - run: nix run --quiet ./offchain#registry-cli-build-graph-check
      - run: nix run --quiet ./offchain#registry-cli-build-graph-controls
  coverage:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Theorem coverage strict completion (reporting)
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Strict completion verdict with an explicit nonzero baseline: passes
      # while the record honestly reports INCOMPLETE, fails closed on any
      # input error, and fails loudly the day debt reaches zero without the
      # expectation being updated. Reporting only — never added to the pages
      # job's needs, so a red completion state can never block docs deploys.
      - run: nix run --quiet .#coverage-check
      # Packaged unit controls, including the real-git candidate-binding
      # suite (runs with git on PATH, so the controls run, not skip).
      - run: nix run --quiet .#coverage-tests
  rendered-docs:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Rendered documentation
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#docs-check
  dev-shell:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Development shell build
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet --no-link .#devShells.x86_64-linux.default
      # #463: whole-repository `just lint` runs here, inside the development
      # shell that pins its checkers, on every PR. No other hosted job runs
      # it (`just ci-shell` is a local bundle only); the off-chain Haskell
      # lint keeps its own job.
      - run: nix develop --quiet -c just lint
  dev-shell-checks:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Development shell checks
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #467: the dev-shell checks, each inside the development shell that
      # pins its tools. Parallel to the Development shell build job.
      # check-presentation additionally runs inside the Rendered documentation
      # job's docs-check (both run `tools/check_presentation_repo.py`) — a
      # pre-existing overlap, both kept. Inventory orphan controls run in the
      # Code inventory job's Refuse unclassified sources step, test-tag
      # controls inside its inventory-check step; format controls run in the
      # Conformance format-check job's format-controls step — none of them here.
      # #544: the IO ownership check and its controls (census, allowlist,
      # site binding, B1-B5) run here, in the shell that pins python3.
      - run: nix develop --quiet -c just application-model
      - run: nix develop --quiet -c just application-held-model
      - run: nix develop --quiet -c just open-datum-application-held-model
      - run: nix develop --quiet -c just check-presentation
      - run: nix develop --quiet -c just rename-registry-test
      - run: nix develop --quiet -c bash tools/no-global-fixture-state.sh
      - run: nix develop --quiet -c just node-confinement
      - run: nix develop --quiet -c just node-confinement-controls
      - run: nix develop --quiet -c just io-ownership-check
      - run: nix develop --quiet -c just io-ownership-controls
      - run: nix develop --quiet -c just lint-controls
  release-check:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Documentation release checks
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#release-check
  release-artifacts:
    if: github.event.action != 'closed'
    needs: build-gate
    name: On-chain release assembly and artifact checks
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The release pipeline itself, run end to end on the candidate: both
      # compiled blueprints are built by their own locked flakes, the
      # on-chain archive is assembled by the packaging tools, and the full
      # release check — archive members, checksum manifests, release text,
      # and the pinned identities verified from the extracted artifact —
      # runs against the assembled bytes. The release surface negative
      # control then proves, on the same bytes, that the corrected
      # availability promise (verified journey documented, retained
      # commands disclosed as not currently buildable or verified) can
      # fail specifically at this boundary. The same assembler — control
      # included — runs inside the publish job before anything is
      # uploaded; the docs-only release-check job does not carry it.
      - name: Exclude compiled test controls from both ordinary release closures
        run: nix run --quiet .#release-build-control
      - run: nix run --quiet .#release-artifacts -- "$RUNNER_TEMP/release"
      # #326: every refusal of the release verifier, by name, from the
      # verifier itself: the real published v0.7.0, downloaded without
      # credentials, predates the stated model revision and is refused as
      # model-revision-missing; mutated copies of the assets just assembled
      # are refused as sum-mismatch, model-revision-missing,
      # model-revision-mismatch, member-missing and command-failed. The
      # accepting run of the same verifier over the unmutated assets is the
      # Registry workflow's Demo 1 job.
      - run: nix run --quiet .#verify-release-controls -- "$RUNNER_TEMP/release"
  release-review-reproduction:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Release review archive reproduction
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #565: the review archive reproduces from its own bytes. The app
      # assembles the docs release with the same tools the release uses
      # (tools/prepare_release.py inside the docs derivation, no second
      # assembler), extracts it outside the checkout, runs the checksum
      # manifest and the archived check, and proves the check can fail by
      # removing the constitution with the manifest recomputed. Timeout
      # from the desk rule (30 minutes cold; the Lean builds are cached).
      - run: nix run --quiet .#release-review-check
      # The two archive-app steps run the extracted review flake's check
      # and default apps from the extraction, exactly as the reproduction
      # instructions document, so the declared-checks census credits
      # release-review (the resolver maps the artifacts/review extraction
      # back onto it). Cache-warm after the app's run above.
      - name: Run the archived review apps from the extracted archive
        run: |
          set -euo pipefail
          release_out="$(nix build --quiet --no-link --print-out-paths .#docs-release)"
          extracted="$(mktemp -d "$RUNNER_TEMP/extracted.XXXXXX")"
          tar -C "$extracted" -xzf "$release_out"/singular-docs-*.tar.gz
          test ! -e "$extracted/.git" || { echo 'FAIL: the archive carries a git checkout'; exit 1; }
          cd "$extracted"
          sha256sum --check artifacts/SHA256SUMS
          cd "$extracted/artifacts/review"
          nix run --no-write-lock-file .#check
          nix run --no-write-lock-file .#default
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Live documentation preview
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix build --quiet .#docs -o result-docs
          cp -R -L result-docs preview-site
          chmod -R u+w preview-site
          printf '%s\n' "$CANDIDATE_SHA" > preview-site/candidate.txt
      - id: publish
        uses: paolino/dev-assets/static-preview@a8f2ff7603bc793794d3e4459b2d5510a57e72a2
        with:
          path: preview-site
          comment: 'false'
      - name: Verify live candidate bytes
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview-url }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix run --quiet .#preview-check -- "$PREVIEW_URL" result-docs "$CANDIDATE_SHA"
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: nixos
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: paolino/dev-assets/static-preview@a8f2ff7603bc793794d3e4459b2d5510a57e72a2
        with:
          mode: cleanup
          comment: 'false'
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-gate, model, simulator, browser, rendered-docs, dev-shell, release-check, release-artifacts]
    runs-on: nixos
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet .#docs -o result-docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: result-docs
      - id: deployment
        uses: actions/deploy-pages@v5
