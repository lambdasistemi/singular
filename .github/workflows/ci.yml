name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-gate:
    if: github.event.action != 'closed'
    name: Build Gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-build-gate"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet --no-eval-cache .#build-gate
  model:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Lean model and exact statement debt
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-model"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#model-check
  simulator:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Simulator corpus parity and controls
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-simulator"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#simulator-check
  browser:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Simulator browser checks
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-browser"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#browser-check
  rendered-docs:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Rendered documentation
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-rendered-docs"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#docs-check
  dev-shell:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Development shell build
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-dev-shell"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop --quiet -c just ci
  release-check:
    if: github.event.action != 'closed'
    needs: build-gate
    name: Documentation release checks
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-release-check"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix run --quiet .#release-check
  preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Live documentation preview
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-preview"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix build --quiet .#docs -o result-docs
          cp -R -L result-docs preview-site
          chmod -R u+w preview-site
          printf '%s\n' "$CANDIDATE_SHA" > preview-site/candidate.txt
      - id: publish
        uses: paolino/dev-assets/static-preview@a8f2ff7603bc793794d3e4459b2d5510a57e72a2
        with:
          path: preview-site
          comment: 'false'
      - name: Verify live candidate bytes
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.preview-url }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: nix run --quiet .#preview-check -- "$PREVIEW_URL" result-docs "$CANDIDATE_SHA"
  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cleanup-preview"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: paolino/dev-assets/static-preview@a8f2ff7603bc793794d3e4459b2d5510a57e72a2
        with:
          mode: cleanup
          comment: 'false'
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-gate, model, simulator, browser, rendered-docs, dev-shell, release-check]
    runs-on: nixos
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pages"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet .#docs -o result-docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: result-docs
      - id: deployment
        uses: actions/deploy-pages@v5
