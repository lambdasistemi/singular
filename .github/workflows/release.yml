name: Documentation release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-gate:
    name: Release build gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-build-gate"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet --no-eval-cache .#build-gate
  release-pr:
    if: github.ref == 'refs/heads/main'
    needs: build-gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-release-pr"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - name: Mint repository-scoped automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: singular
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Mint repository-scoped publication token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: singular
          permission-contents: write
          permission-pull-requests: write
      - name: Publish the authorized tagged documentation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: nix run --quiet .#publish-docs -- "$RELEASE_TAG" "$TAG_COMMIT"
