name: Documentation release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-gate:
    name: Release build gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-build-gate"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --quiet --no-eval-cache .#build-gate
  # ---
  # Coverage release boundary (issue #80 slice t80c). PREPARED AND INERT:
  # `if: false` keeps this job out of every trigger path until the
  # integration commit removes it. When active, it binds the exact tag
  # commit as the release candidate and fails the job unless the
  # theorem-coverage gate reports COMPLETE for that candidate — blocking
  # the documentation and on-chain archive publication (the publish step
  # uploads both through publish-docs; the workflow name understates it).
  # A committed PASS row proves input identity (bytes bound
  # from the candidate commit), not that its claims were executed:
  # execution debt (unexecuted, skipped, failing, vacuous, invalid
  # control, stale-candidate evidence) still refuses as INCOMPLETE, and
  # current debt is preserved (denominator 196, no exclusions, no
  # reclassification) until fresh attributable evidence exists.
  # Integration: delete the `if: false` line below and add
  # `coverage-release-gate` to the publish job's `needs:`.
  coverage-release-gate:
    if: false
    name: Theorem coverage release boundary (must be COMPLETE)
    needs: build-gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-coverage-release"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The exact candidate identity is bound into the command: the tag
      # commit this workflow ran on. Any nonzero exit fails the job and,
      # once wired into publish's needs, blocks publication.
      - name: Release gate must report COMPLETE for the tag commit
        run: nix run --quiet .#coverage-gate -- --root . release --candidate ${{ github.sha }}
  release-pr:
    if: github.ref == 'refs/heads/main'
    needs: build-gate
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-release-pr"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - name: Mint repository-scoped automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: singular
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
  # #695: the platform bundles, built and smoke-tested on their own platforms
  # by the same workflow pull requests run; the publisher adds what they
  # uploaded to the release.
  bundles:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-gate
    uses: ./.github/workflows/release-bundles.yml
    secrets: inherit
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-gate, bundles]
    runs-on: nixos
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Mint repository-scoped publication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: singular
          permission-contents: write
          permission-pull-requests: write
      - name: Download the release bundles
        uses: actions/download-artifact@v8
        with:
          pattern: release-bundle-*
          path: ${{ runner.temp }}/release-bundles
          merge-multiple: true
      - name: Upload the tagged documentation and on-chain release assets
        # The publish-docs app uploads, from the tag this workflow ran on:
        #   singular-docs-<version>.tar.gz      — the documentation release
        #   singular-onchain-<version>.tar.gz   — the epic-scoped on-chain release
        #   SHA256SUMS                          — checksums of both archives
        # plus it creates the release with the epic-scope notes
        # (onchain-release/RELEASE.md). The pipeline publishes; no person
        # uploads by hand.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
          BUNDLES_DIR: ${{ runner.temp }}/release-bundles
        run: nix run --quiet .#publish-docs -- "$RELEASE_TAG" "$TAG_COMMIT"
  verify-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    name: Verify the published release from its downloaded assets
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-verify-release"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #326: the release just published, downloaded without credentials
      # from its GitHub release and checked as anyone would check it: the
      # sums, the model revision the archive states against the one the
      # conformance evidence names, the archive members, and `singular`
      # built from the archive's own flake running create, insert, update,
      # terminate and inspect as separate processes on a development network.
      - name: Verify the tag's published assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: nix run --quiet .#verify-release -- "$RELEASE_TAG"
  # #695: the macOS bundle as published, downloaded without credentials and
  # run on the platform it is for; the Linux verifier above checks its sums
  # and identity but cannot run it.
  verify-macos-bundle:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    name: Verify the published macOS bundle
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: paolino/dev-assets/setup-nix@a9d7371c1118de4026ba6ee3a9c3b54614924b82
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Verify the tag's published bundles
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: nix run --quiet .#verify-release-bundles -- "$RELEASE_TAG" "$TAG_COMMIT"
  # #707: the Linux packages of the distribution standard, published to the
  # release just created: an AppImage per command, one DEB and one RPM with
  # every command, and their own SHA256SUMS, built by the release outputs the
  # tag run of the bundles workflow already built, smoke-tested and installed
  # on machines without Nix.
  linux-packages:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    name: Publish the Linux packages
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-linux-packages"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Mint repository-scoped publication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: singular
          permission-contents: write
      - name: Build, smoke-test and publish the Linux packages
        uses: paolino/dev-assets/linux-release@6f017970a83f8da90e2cff0a391e71f6e8a85d15
        with:
          mode: release
          tag: ${{ github.ref_name }}
          publish: "yes"
          release-output: linux-release-artifacts
          dev-output: linux-dev-release-artifacts
          executable-name: singular
          commands: singular,open-datum,devnet
          smoke-args: --version
          usage-grep: "(commit "
          dev-tag: dev-linux
          release-version-command: cat version.txt
          release-check-command: '[ "$TAG" = "v$(cat version.txt)" ]'
          github-token: ${{ steps.app-token.outputs.token }}
  # #707: the Homebrew formula of the release just published and verified,
  # built from the macOS tarball the release already carries: the action
  # requires the published asset to be that tarball, pushes the formula to the
  # organisation's tap with a token minted for the tap alone, then installs
  # lambdasistemi/tap/singular from the tap and runs brew test.
  homebrew:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify-release, verify-macos-bundle]
    name: Publish the Homebrew formula
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: paolino/dev-assets/setup-nix@a9d7371c1118de4026ba6ee3a9c3b54614924b82
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Mint a token for the Homebrew tap alone
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: lambdasistemi
          repositories: homebrew-tap
          permission-contents: write
      - name: Build, check and publish the formula, then install it from the tap
        uses: paolino/dev-assets/darwin-homebrew-release@6f017970a83f8da90e2cff0a391e71f6e8a85d15
        with:
          mode: release
          tag: ${{ github.ref_name }}
          publish: "yes"
          upload-assets: "no"
          release-formula: singular.rb
          dev-formula: singular-dev.rb
          tarball-pattern: "singular-*-aarch64-darwin.tar.gz"
          installed-commands: singular open-datum devnet
          cleanup-formulae: singular singular-dev
          tap-name: lambdasistemi/tap
          tap-repository: lambdasistemi/homebrew-tap
          release-check-command: '[ "$TAG" = "v$(cat version.txt)" ]'
          tarball-smoke-script: |
            singular --version
            open-datum --version
            devnet --version
          brew-smoke-script: |
            singular --version
            open-datum --version
            devnet --version
          github-token: ${{ github.token }}
          tap-token: ${{ steps.tap-token.outputs.token }}
