# MPFS cross-tree gates (A-002, D-005).
#
# This workflow enforces the two cross-tree relationships that neither
# isolated flake can see (the trees are two self-contained flakes since
# the two-flake split; a green `nix flake check` on either asserts
# nothing about vector freshness, and nothing builds the blueprint
# before the Haskell side consumes it):
#
#   1. the real vector comparison — the Haskell generator's output,
#      formatted by the pinned Aiken, diffed against the committed
#      golden `onchain/validators/cage_vectors.ak` (D-003/D-006);
#   2. an explicit order — the Aiken blueprint build is a job of its
#      own and the devnet E2E job runs only after it (`needs:`): if the
#      blueprint cannot build, the expensive devnet job is skipped
#      instead of failing later for the same reason. Freshness itself is
#      NOT carried by the ordering edge: the e2e recipe builds
#      ../onchain#plutus-blueprint itself and points MPFS_BLUEPRINT at
#      that exact store path, so what the suite consumes is always the
#      artifact built from the checked-out commit. `needs:` is the
#      ordering and fail-fast; the recipe is the freshness guarantee.
#
# Every command below was executed on the worker host before this file
# was written, with receipts (t31-recipes-ci handoffs/recipes-ci-report.md):
#   - nix build --quiet --no-link --print-out-paths .#plutus-blueprint  (exit 0)
#   - nix develop --quiet --command just vectors-check                  (exit 0, PASS)
#   - nix develop --quiet --command just haskell-e2e                    (exit 0, 6/6)
name: MPFS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'onchain/**'
      - 'naming-onchain/**'
      - 'offchain/**'
      - '.github/workflows/mpfs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'onchain/**'
      - 'naming-onchain/**'
      - 'offchain/**'
      - '.github/workflows/mpfs.yml'
permissions:
  contents: read
concurrency:
  group: mpfs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  naming-validators:
    name: Naming validators build, refuse, and match their pinned identity
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-naming"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #52: Singular's own naming validators (naming-onchain/,
      # a separate Aiken tree whose flake.lock is a byte-for-byte copy
      # of onchain's — the two-flake split pattern of D-018). One
      # command runs the whole slice gate: `nix flake check` builds
      # checks.aiken-check (the hermetic Aiken suite — every enforced
      # condition paired with a refusal, fixtures taken from the
      # accepted v0.2.0 corpus rows LM01..LM04/LC01..LC06) and
      # checks.script-identity (the compiled blueprint compared
      # two-directionally against the committed script-identity.json,
      # quantified over the validator set, with parameter counts — the
      # onchain #34 pattern). The copied lock pins the same nixpkgs as
      # the imported partition, so the Aiken compiler — and therefore
      # every pinned hash — is directly comparable with onchain's.
      - name: Run the naming validator suite and identity check
        working-directory: naming-onchain
        run: nix flake check
  blueprint:
    name: Aiken blueprint builds first
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-blueprint"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Aiken blueprint
        working-directory: onchain
        run: nix build --quiet --no-link --print-out-paths .#plutus-blueprint
  script-identity:
    name: Compiled script identity matches the manifest
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-script-identity"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #34: the compiled script hash IS the contract's identity.
      # Rebuild the blueprint and compare every validator against the
      # committed manifest onchain/script-identity.json — a moved hash, a
      # validator missing from the manifest, a manifest entry with no
      # counterpart in the build, or a moved compiler string fails the
      # job. A deliberate identity change regenerates the manifest via
      # `just script-identity-regen`, and the manifest diff is what the
      # reviewer reads. Same derivation as checks.script-identity, so a
      # local `nix flake check` in onchain/ runs the identical comparison.
      - name: Compare the committed manifest with a fresh blueprint build
        working-directory: onchain
        run: nix build --quiet --no-link --print-out-paths .#script-identity
  vectors-fresh:
    name: Cage vectors match the generator
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-vectors-fresh"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Read-only verification (D-006): generate into a temp path, format
      # that with the pinned Aiken (nix develop ../onchain#aiken), diff
      # against the committed golden. The recipe writes nothing in either
      # tree; only `just generate-vectors` writes the golden.
      - name: Diff generator output against the committed golden
        working-directory: offchain
        run: nix develop --quiet --command just vectors-check
  naming-wire:
    name: Naming wire vectors match the epic-15 contract
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-naming-wire"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #45: the naming datum codec must agree with the epic-15
      # v0.2.0 contract's own bytes. The four wire vectors are vendored
      # with provenance in offchain/naming/src/Naming/Wire/Vectors.hs
      # (the codec moved inside the offchain flake root in issue #51),
      # so the job needs no network. The suite is pure base + bytestring
      # and is compiled and run with the dev-shell GHC directly: no
      # cabal, no package index, no warm state (the same D-011 reasoning
      # as the hermetic e2e, at unit-test cost).
      - name: Run the naming wire vector suite
        run: nix develop ./offchain --quiet --command bash offchain/naming/run-suite.sh
  li01:
    name: LI01 canonical initialization, packaged and hermetic
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-li01"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issues #47 + #51: the LI01 canonical-initialization runner on
      # the same hermetic path as the e2e and the journey (D-011). It
      # became a packaged `nix run` app when the naming codec moved
      # inside the offchain flake root (#51): the Nix-built binary
      # brings the locked cardano-node on its own PATH; no dev shell,
      # no cabal, no package index, no warm developer state. `needs:`
      # is ordering and fail-fast on the blueprint, exactly as for the
      # e2e and journey jobs; the step builds the blueprint from the
      # onchain flake itself and points MPFS_BLUEPRINT at that store
      # path, so the consumed artifact is always built from the
      # checked-out commit. The runner asserts the row's witness
      # shape, the chain-read canonical binding, the initial naming
      # checkpoint datum (decoded with the Naming.Datum codec against
      # the contract's vendored bytes) and the resulting state, and
      # exits non-zero on any mismatch (marker li01-state-matches-row).
      - name: Run LI01 as a packaged app without a dev shell
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          MPFS_BLUEPRINT="$blueprint" nix run --quiet .#li01
  e2e:
    name: Devnet E2E on the fresh blueprint
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-e2e"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Hermetic devnet run (D-011): no `nix develop`, no `just`, no
      # cabal — nothing consults a package index or any ambient state.
      # haskell.nix resolves every dependency of the wrapped
      # `cage-tests-e2e` binary at build time, and the wrapper puts the
      # locked cardano-node (offchain#cardano-node) on its own PATH.
      # The step builds the blueprint from the onchain flake first and
      # points MPFS_BLUEPRINT at that store path, then runs the suite —
      # six MPFS cage scenarios: boots state and applies a request
      # update; retracts a phase-2 request; rejects a phase-3 request;
      # ends a cage by burning the state token; sweeps malformed
      # request-address UTxOs; Modify and End succeed with
      # staking-script withdrawal. `needs:` stays ordering and
      # fail-fast: if the blueprint cannot build, this expensive job is
      # skipped instead of failing later for the same reason, while
      # freshness itself is carried by the step's own blueprint build
      # (the consumed artifact is always built from the checked-out
      # commit). The suite covers the cage protocol surface only — it
      # does not cover Singular's naming-claim or maintenance behaviour.
      - name: Run the devnet E2E against a fresh blueprint
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          MPFS_BLUEPRINT="$blueprint" nix run --quiet .#cage-tests-e2e
  journey:
    name: The bounded MPFS cage journey, narrated end to end
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Isolate Nix cache
        run: |
          cache_dir="$RUNNER_TEMP/nix-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-journey"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #37: the epic's runnable artifact. One command boots a
      # cage, submits a request, applies it and reads the resulting
      # state back on a real devnet, printing one line per step plus
      # the pinned unapplied script identities (read from
      # onchain/script-identity.json) and the applied hashes this run
      # derived from them and carried on chain — the
      # derived-applied-identity assertion fails the job when the
      # derivation does not reproduce an applied hash. It is the
      # same library code
      # path as the e2e suite — no mocks, no stubbed node — and it is
      # hermetic (D-011): the Nix-built binary brings the locked
      # cardano-node on its own PATH; no cabal, no package index, no
      # warm developer state. It covers the cage protocol surface
      # only — it does not demonstrate Singular naming-claim or
      # maintenance behaviour.
      - name: Run the bounded MPFS cage journey against a real devnet
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          MPFS_BLUEPRINT="$blueprint" nix run --quiet .#journey
