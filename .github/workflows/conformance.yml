name: Conformance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'onchain/**'
      - 'applications/**'
      - 'lean/**'
      - 'tools/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main, 'epic/**']
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Workflow parses, lints clean, owned docs page bound
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # A workflow that cannot be parsed cannot fail loudly: every
      # workflow file must parse before anything else runs. yq-go
      # comes from nixpkgs so the check needs nothing the runner
      # lacks.
      - name: Every workflow file parses as YAML
        run: |
          for f in .github/workflows/*.yml; do nix run --quiet nixpkgs#yq-go -- eval '.' "$f" > /dev/null; done
      # Declare the repository's self-hosted runner label, then
      # require actionlint itself to succeed, including shellcheck.
      - name: actionlint carries no new findings
        run: |
          printf 'self-hosted-runner:\n  labels: [nixos]\n' > "$RUNNER_TEMP/conformance-actionlint.yaml"
          nix run --quiet nixpkgs#actionlint -- -config-file "$RUNNER_TEMP/conformance-actionlint.yaml" .github/workflows/conformance.yml
      # The owned docs page keeps its speech companion: present and
      # covering its headings, bound to its hash. The repository's
      # own docs CI (just ci) remains the backstop for doc-only
      # changes outside this workflow's path filter.
      - name: Owned docs page passes the presentation gate
        run: nix run --quiet .#presentation-check -- --front README.md --register docs/model-ledger.md --register docs/theorems.md --register docs/mutants.md docs/consumer-conformance.md
  format-check:
    name: Conformance Haskell format and lint check
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #278 terminal-attestation-permanent: the Conformance Haskell tree under the house Fourmolu
      # configuration — the one committed fourmolu.yaml at the repository
      # root, passed explicitly so a missing configuration fails loudly
      # instead of falling back to Fourmolu defaults. The app discovers
      # its extent from the Cabal manifests at check time (the Conformance
      # stanzas plus the #80 evaluation spike), runs the pinned Fourmolu
      # its lock resolves, and checks the FLAKE SOURCE (a store copy), so
      # the bytes it checks are candidate-bound — the same shape as the
      # off-chain lint app. The whole-tree checkout-context carrier (both
      # Haskell trees, same configuration, same extent) runs hosted as the
      # baseline of this job's format-controls step below (the controls
      # script first checks the real root, as `just format-check` does) and
      # locally via `just format-check` inside local `just ci`; the negative
      # and positive controls run hosted in that format-controls step
      # (`nix run .#format-controls`).
      - run: nix run --quiet .#format-check
        working-directory: conformance
      # #278 supply-matches-leaf-state: HLint over the same discovered extent, with the pinned
      # HLint the off-chain lint resolves; no exclusions, no ignore file.
      - run: nix run --quiet .#hlint-check
        working-directory: conformance
      # #562 item 5b: the house formatter controls over the whole-tree
      # checkout extent with the pinned house Fourmolu. Runs from the
      # repository root (no working-directory), scratch owned and cleaned.
      - run: nix run --quiet .#format-controls
  evaluation-cleanup-controls:
    name: Evaluation cleanup controls
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562 item 4: the evaluation cleanup-control suite (four cases over
      # the factored cleanup predicate), `cabal test cleanup-control` of
      # conformance/coverage/evaluation under the pinned toolchain the
      # conformance flake resolves. The app owns its scratch copy and the
      # cabal download cache lives under this runner's XDG_CACHE_HOME; the
      # pass criterion is exit 0 with `1 of 1 test suites passed`. Five
      # minutes from the measured 89 seconds plus a cold cache.
      - run: nix run --quiet ./conformance#evaluation-cleanup-controls
  publication-boundary:
    name: Publication boundary controls
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562 item 3: the publication boundary control, hosted. The app runs
      # the publisher definition from nix/release.nix with only gh replaced
      # by a recorder, through its positive path and its mutated cases; the
      # pass criterion is exit 0 with the final line ALL CASES HELD.
      # OUTDIR and EVIDENCE point under RUNNER_TEMP so the tracked evidence
      # log conformance/coverage/publication-boundary-evidence.log is never
      # written and the tree stays clean. Ten minutes from the measured
      # 400 seconds.
      # Each invocation retains its evidence in fresh, run-specific scratch.
      - run: |
          run_dir="$(mktemp -d "$RUNNER_TEMP/publication-boundary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.XXXXXX")"
          OUTDIR="$run_dir" EVIDENCE="$run_dir/evidence.log" nix run --quiet .#publication-boundary-controls
  conformance-checks:
    name: Conformance checks without a devnet
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run the unit tests as a packaged app without a dev shell
        working-directory: conformance
        run: nix run --quiet .#conformance-appendix-tests
      - name: List the inventory as a packaged app without a dev shell
        working-directory: conformance
        run: nix run --quiet .#conformance -- list
      - name: Comparison statements are published uncovered with their evidence boundary
        working-directory: conformance
        run: |
          nix run --quiet .#conformance -- list > "$RUNNER_TEMP/registration-journey-inventory.tsv"
          nix shell --quiet nixpkgs#jq nixpkgs#coreutils nixpkgs#gawk nixpkgs#gnugrep -c bash test/ci/registration-journey-rows.sh "$RUNNER_TEMP/registration-journey-inventory.tsv" rows.json test/ci/registration-journey-frozen-rows.txt
          nix shell --quiet nixpkgs#jq nixpkgs#coreutils nixpkgs#gawk nixpkgs#gnugrep -c bash test/ci/registration-journey-rows-control.sh "$RUNNER_TEMP/registration-journey-inventory.tsv" rows.json test/ci/registration-journey-frozen-rows.txt
          nix shell --quiet nixpkgs#jq nixpkgs#coreutils nixpkgs#gawk nixpkgs#gnugrep -c bash test/ci/shared-publication-rows.sh "$RUNNER_TEMP/registration-journey-inventory.tsv" rows.json test/ci/shared-publication-frozen-rows.txt
          nix shell --quiet nixpkgs#jq nixpkgs#coreutils nixpkgs#gawk nixpkgs#gnugrep -c bash test/ci/shared-publication-rows-control.sh "$RUNNER_TEMP/registration-journey-inventory.tsv" rows.json test/ci/shared-publication-frozen-rows.txt
  coverage-gate:
    name: Theorem coverage gate — inventory, ratchet and completion as distinct results
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Gate test suite incl. every armed failure control (frozen snapshot)
        working-directory: conformance
        run: nix build --quiet --no-link .#coverageGateTests
      - name: Gate verdicts against the frozen snapshot (inventory, ratchet, honest refusal)
        working-directory: conformance
        run: nix build --quiet --no-link .#coverageGateSnapshot
      - name: Inventory — reconcile manifests and discover the obligation population
        run: nix run --quiet ./conformance#coverage-gate -- --root . inventory
      - name: Ratchet — per-obligation regression against the protected base (must pass)
        run: nix run --quiet ./conformance#coverage-gate -- --root . ratchet
      - name: Completion — must refuse while debt is nonzero (flipping this is claiming completion)
        run: |
          if nix run --quiet ./conformance#coverage-gate -- --root . completion; then
            echo "COMPLETION claimed complete; if this is real, flip this step deliberately"
            exit 1
          else
            rc=$?
            test "$rc" -eq 1 || { echo "completion gate failed closed (exit $rc), not INCOMPLETE"; exit 1; }
            echo "COMPLETION: INCOMPLETE — the honest nonzero baseline, reported as its own result"
          fi
