name: Conformance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'onchain/**'
      - 'lean/**'
      - 'tools/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Workflow parses, lints clean, owned docs page bound
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # A workflow that cannot be parsed cannot fail loudly: every
      # workflow file must parse before anything else runs. yq-go
      # comes from nixpkgs so the check needs nothing the runner
      # lacks.
      - name: Every workflow file parses as YAML
        run: |
          for f in .github/workflows/*.yml; do nix run --quiet nixpkgs#yq-go -- eval '.' "$f" > /dev/null; done
      # Declare the repository's self-hosted runner label, then
      # require actionlint itself to succeed, including shellcheck.
      - name: actionlint carries no new findings
        run: |
          printf 'self-hosted-runner:\n  labels: [nixos]\n' > "$RUNNER_TEMP/conformance-actionlint.yaml"
          nix run --quiet nixpkgs#actionlint -- -config-file "$RUNNER_TEMP/conformance-actionlint.yaml" .github/workflows/conformance.yml
      # The owned docs page keeps its speech companion: present and
      # covering its headings, bound to its hash. The repository's
      # own docs CI (just ci) remains the backstop for doc-only
      # changes outside this workflow's path filter.
      - name: Owned docs page passes the presentation gate
        run: nix develop --quiet --command python3 tools/check_presentation.py --front README.md --register docs/model-ledger.md --register docs/theorems.md --register docs/mutants.md docs/consumer-conformance.md
  conformance:
    name: Generic, canonical-identity and serialization rows on a real devnet
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #63: the four generic registry operations the naming
      # demonstration can never exercise — Update, Delete,
      # re-Insert after Delete, and the refusal of Insert on an
      # occupied key — executed against a real devnet, each with its
      # executing negative control and its measurements against the
      # devnet's Conway protocol maxima. Issue #70 then extends the
      # same session with its active rows: three attributed refusals
      # (CG07/CG09/CG10) and the held rows CG11/CG12/CG19. CG13, CG17
      # and CG20 are NOT run: retired superseded history per E18
      # (NOTE-046, CG16 template) — the owner-pinning transfer, the
      # custody sweep and the removed-signer regression tested an
      # owner role the registry does not have; their observations
      # live in rows.json, never as coverage. CG14/CG15 are NOT run:
      # superseded inherited-hook expectations with could-not-execute
      # history — no work waits behind them.
      #
      # A session containing held rows ends NON-ZERO by design (a held
      # row must never read as a pass). Per the A-001 ruling this step
      # never treats that exit — or any error label — as success: the
      # expected-debt assertion below reads the session's ACTUAL
      # results and demands exactly the eleven rows, exactly the
      # expected verdict per row (receipts), no divergence, and a
      # non-zero exit accounted for by exactly the held rows CG11
      # CG12 CG19 and nothing else. A GREEN STEP IS NOT A FULFILLED
      # CONSUMER PROMISE: R5/R8/R11 stay unmet (upstream #100/#101);
      # strict completion and release stay RED on that debt. Issue #69 then runs the CA
      # rows as their own session: the consumer's authentication of
      # the canonical registry identity, with the rival the ledger
      # cannot refuse executed beside it. The unit suite (inventory
      # denominator, receipt overlay, refusal matcher, authenticator
      # decisions) runs first and fails fast; the devnet runs are
      # the expensive gate. The blueprint is built from the
      # checked-out commit and passed at run time, so freshness is
      # carried by the recipe, not the ordering edge. The runner
      # sets its own unique TMPDIR and never touches the default
      # path, so concurrent devnet lanes keep their databases.
      - name: Run the unit suite as a packaged app without a dev shell
        working-directory: conformance
        run: nix run --quiet .#conformance-tests
      - name: List the inventory as a packaged app without a dev shell
        working-directory: conformance
        run: nix run --quiet .#conformance -- list
      # Read all nineteen model-and-chain step records from the retirement
      # receipt. The refusals must carry state-script attribution, and
      # every accepted step must compare the declared surface and reject
      # discovered-value perturbations. The separate registry makes the
      # unknown-key attempt independent of the Absent refusal. The two
      # tampered deletions, paying the deposit back one lovelace short and
      # to another address, are refused by the state script and by the
      # model, whose reason is the one the compiled Aiken suite names for
      # the shape: onchain/validators/deposit_exits.tests.ak
      # e5_deposit_one_lovelace_short_refuses and
      # e5_deposit_diverted_to_another_address_refuses (deposit-returned).
      # The same program then lets requests leave unfolded, each exit named
      # by the step. In a registry of its own, a reject refunding the owner
      # one lovelace short and to another key is refused by the state script
      # and by the model for deposit-returned, the name
      # onchain/validators/deposit_exits.tests.ak
      # reject_refund_one_lovelace_short_refuses_by_name and
      # reject_refund_to_another_key_refuses_by_name assert; the untampered
      # reject is accepted by both. In another, an insertion only (the chain
      # admits no other retraction until #239), a retraction returning one
      # lovelace short, to another key and bound to another output reference
      # is refused by the request script and by the model for
      # deposit-returned, as onchain/validators/cage_retract.tests.ak
      # retract_held_short_by_one_refuses, retract_held_wrong_owner_refuses
      # and retract_wrong_reference_refuses assert; one spending the
      # registry's state beside it is refused for retract-state-spent, as
      # retract_beside_a_fold_refuses asserts; the untampered retraction,
      # bound to the request's own output reference and signed by its owner,
      # is accepted by both. The ledger's own reason is not observed: the
      # deployed validators are compiled without traces (#287).
      - name: Run the dedicated CG22 retirement row as a packaged app
        run: |
          set -e
          cd conformance
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          receipts="$(mktemp -d "$RUNNER_TEMP/cg22-receipts.XXXXXX")"
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG22 --receipts-dir "$receipts"
          head_sha="$(git rev-parse HEAD)"
          f="$receipts/receipt-CG22.json"
          test -f "$f" || { echo 'FAIL: missing CG22 receipt'; exit 1; }
          state_hash="$(nix run --quiet nixpkgs#jq -- -er '.validators[] | select(.title == "state.state.spend" and ((.parameters // []) | length) == 0) | .hash' "$blueprint")"
          # jq expands its own --arg variables inside this program.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg base "$head_sha" --arg state "$state_hash" '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def text: type == "string" and length > 0;
            def complete: .comparison == "agrees" and .tamper == null
              and (.compared | length) == 9 and .perturbation.refused > 0;
            .row == "CG22"
            and .verdict == "agrees-with-model"
            and .base == $base and .dirty == false
            and (.blueprint | text) and (.node | text)
            and (.steps | length) == 19
            and ([.steps[].edge] == ["insertActive","updateTerminal","insertAbsent","updateTerminal","insertActive","updateTerminal","updateTerminal","insertActive","deleteActive","deleteActive","deleteActive","insertActive","insertActive","insertActive","insertActive","insertActive","insertActive","insertActive","insertActive"])
            and ([.steps[].exit] == ["insertActive","updateTerminal","insertAbsent","updateTerminal","insertActive","updateTerminal","updateTerminal","insertActive","deleteActive","deleteActive","deleteActive","reject","reject","reject","retract","retract","retract","retract","retract"])
            and ([.steps[].tamper] == [null,null,null,null,null,null,null,null,"short-by-one","other-address",null,"short-by-one","other-address",null,"short-by-one","other-address","other-reference","state-spent",null])
            and ([.steps[].model.outcome] == ["accepted","accepted","accepted","refused","accepted","accepted","refused","accepted","refused","refused","accepted","refused","refused","accepted","refused","refused","refused","refused","accepted"])
            and ([.steps[].chain.outcome] == ["accepted","accepted","accepted","refused","accepted","accepted","refused","accepted","refused","refused","accepted","refused","refused","accepted","refused","refused","refused","refused","accepted"])
            and all(.steps[]; .comparison == "agrees")
            and .steps[8].model.reason == "deposit-returned"
            and .steps[9].model.reason == "deposit-returned"
            and all(.steps[8,9]; (.chain.txid | txid) and (.chain.refusal.hashes | index($state) != null))
            and ([.steps[8,9,10].request] | unique | length) == 1
            and .steps[10].registry == .steps[0].registry
            and .steps[7].registry == .steps[0].registry
            and all(.steps[] | select(.model.outcome == "accepted"); complete and (.chain.txid | txid))
            and all(.steps[] | select(.model.outcome == "refused");
              (.chain.txid | txid) and (.chain.refusal.hashes | length) > 0)
            and .steps[3].model.reason == "not-booked"
            and .steps[6].model.reason == "key-unknown"
            and .steps[1].perturbation.byObservation.mint > 0
            and .steps[1].perturbation.byObservation.leaf > 0
            and .steps[0].registry == .steps[1].registry
            and .steps[1].registry == .steps[2].registry
            and .steps[2].registry == .steps[3].registry
            and .steps[4].registry == .steps[5].registry
            and .steps[5].registry == .steps[6].registry
            and .steps[0].registry != .steps[4].registry
            and all(.steps[11,12]; .model.reason == "deposit-returned"
              and (.chain.refusal.hashes | index($state) != null)
              and (.chain.refusal.scripts | index("state") != null))
            and all(.steps[14,15,16]; .model.reason == "deposit-returned"
              and (.chain.refusal.scripts | index("request") != null))
            and .steps[17].model.reason == "retract-state-spent"
            and (.steps[17].chain.refusal.scripts | index("request") != null)
            and ([.steps[11,12,13].registry] | unique | length) == 1
            and ([.steps[14,15,16,17,18].registry] | unique | length) == 1
            and ([.steps[0,4,11,14].registry] | unique | length) == 4
            and all(.steps[] | select(.exit == "retract");
              (.edge == "insertAbsent" or .edge == "insertActive" or .edge == "witnessTerminal")
              and (.request.reference | type) == "number")
            and ([.steps[14,15,16,17,18].request.reference] | unique | length) == 5
            and (.transactions | length) == 9
          ' "$f" > /dev/null || { echo 'FAIL: CG22 retirement evidence moved'; exit 1; }
      - name: Run the generic rows as a packaged app without a dev shell
        working-directory: conformance
        run: |
          set -e
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # The receipts directory is invocation-fresh: stale records
          # must never supplement a partial or failed run.
          CONFORMANCE_RECEIPTS="$(mktemp -d "$RUNNER_TEMP/conformance-receipts.XXXXXX")"
          export CONFORMANCE_RECEIPTS
          printf 'CONFORMANCE_RECEIPTS=%s\n' "$CONFORMANCE_RECEIPTS" >> "$GITHUB_ENV"
          set +e
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG02 CG03 CG04 CG05 CG07 CG09 CG10 CG11 CG12 CG19 CG21 --receipts-dir "$CONFORMANCE_RECEIPTS" 2>&1 | tee /tmp/generic-rows.log
          run_rc=${PIPESTATUS[0]}
          set -e
          echo "generic session exit: $run_rc (expected: exactly 1, the handled session-debt exit)"
          # --- expected-debt assertion over ACTUAL session results
          # --- (A-001, NOTE-002: never success from a bare nonzero or
          # --- an error label; build/setup/crash/unknown must FAIL)
          head_sha="$(git rev-parse HEAD)"
          # 1. the EXACT intended session-debt status, never "nonzero":
          #    Main.hs maps every handled session failure to exit 1, so
          #    exit 1 is the intended result ONLY together with the
          #    complete terminal evidence asserted below.
          [ "$run_rc" -eq 1 ] || { echo "FAIL: session exit $run_rc is not the known session-debt exit 1 — a build/setup/crash exit is an unexamined failure, not expected debt"; exit 1; }
          # 2. complete session evidence: all 11 rows executed...
          grep -q 'complete: 11/11 rows ok' /tmp/generic-rows.log || { echo 'FAIL: the session did not complete all 11 rows (mid-run failure or crash)'; exit 1; }
          #    ...and the terminal failure is the held-rows debt report
          grep -q 'ROWS THE RUN CANNOT REPORT AS PASSING' /tmp/generic-rows.log || { echo 'FAIL: the terminal failure is not the held-rows debt report'; exit 1; }
          # 3. exactly the eleven rows plus the session CL01, no extras
          printf '%s\n' CG02 CG03 CG04 CG05 CG07 CG09 CG10 CG11 CG12 CG19 CG21 CL01 | sort > /tmp/expected-rows.txt
          nix run --quiet nixpkgs#jq -- -r '.row' "${CONFORMANCE_RECEIPTS}"/receipt-*.json | sort > /tmp/receipt-rows.txt
          #    Compared with bash builtins, not diff: this step runs a packaged
          #    app without a dev shell, and an absent diff previously reported
          #    'receipt set mismatch' — an unavailable tool misattributed as a
          #    substantive failure. No external command, so no such path remains.
          if [ "$(</tmp/expected-rows.txt)" != "$(</tmp/receipt-rows.txt)" ]; then
            echo 'FAIL: receipt set mismatch (missing or extra row)'
            echo '--- expected rows ---'; while IFS= read -r l; do echo "$l"; done < /tmp/expected-rows.txt
            echo '--- receipt rows ---';  while IFS= read -r l; do echo "$l"; done < /tmp/receipt-rows.txt
            exit 1
          fi
          # 4. exactly the expected verdict per receipt, EVERY receipt
          #    bound to this candidate on a clean tree (dirty:false)
          expect_verdict() {
            case "$1" in
              CG02|CG03|CG04|CG05|CG07|CG09|CG10|CG21|CL01) printf 'agrees-with-model' ;;
              CG11|CG12|CG19) printf 'held-q002' ;;
              *) printf 'UNKNOWN-ROW' ;;
            esac
          }
          for row in CG02 CG03 CG04 CG05 CG07 CG09 CG10 CG11 CG12 CG19 CG21 CL01; do
            f="${CONFORMANCE_RECEIPTS}/receipt-$row.json"
            test -f "$f" || { echo "FAIL: missing receipt for $row"; exit 1; }
            v="$(nix run --quiet nixpkgs#jq -- -r '.verdict' "$f")"
            want="$(expect_verdict "$row")"
            [ "$v" = "$want" ] || { echo "FAIL: unexpected verdict for $row: got '$v', expected '$want'"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.dirty' "$f")" = "false" ] || { echo "FAIL: $row receipt records a dirty tree"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.base' "$f")" = "$head_sha" ] || { echo "FAIL: $row receipt is not bound to this candidate ($head_sha)"; exit 1; }
          done
          # 5. CL01 carries the session's measurement evidence: nonzero
          #    units and size, folds named — refuse missing or divergent
          nix run --quiet nixpkgs#jq -- -e '.mem > 0 and .cpu > 0 and .txSize > 0 and (.transactions | length > 0)' "${CONFORMANCE_RECEIPTS}"/receipt-CL01.json > /dev/null || { echo 'FAIL: CL01 measurement evidence missing or divergent'; exit 1; }
          # 6. the run's own accounting must name exactly the expected
          #    held set, with nothing failing against this candidate
          held="$(sed -n 's/^- Held .*held-q002): //p' /tmp/generic-rows.log)"
          [ "$held" = "CG11 CG12 CG19" ] || { echo "FAIL: held set moved: got '$held', expected 'CG11 CG12 CG19'"; exit 1; }
          # nothing may fail against this candidate
          failing="$(sed -n 's/^- Failing .*accepted): //p' /tmp/generic-rows.log)"
          [ "$failing" = "none" ] || { echo "FAIL: rows failing against this candidate: $failing"; exit 1; }
          # 7. Bind observations to full hashes from the compiled
          #    blueprint. The human log marker is abbreviated and
          #    cannot serve as a script identity.
          state_hash="$(nix run --quiet nixpkgs#jq -- -er '.validators[] | select(.title == "state.state.spend" and ((.parameters // []) | length) == 0) | .hash' "$blueprint")"
          # #157 C8/C10: `consumer.ak` is deleted and every rule it re-walked
          # beside the fold is the cage's own, so there is no consumer hook to
          # bind and the cage alone decides. The control below binds the
          # refusal to the state script instead.
          for row in CG11 CG12; do
            f="${CONFORMANCE_RECEIPTS}/receipt-$row.json"
            # jq expands its own --arg variables inside this program.
            # shellcheck disable=SC2016
            nix run --quiet nixpkgs#jq -- -e --arg state "$state_hash" '
              .outcome == "refused" and .venue == "node-submit"
              and (.rejected | test("^[0-9a-f]{64}$"))
              and .refusal.phase == "phase-2"
              and (.refusal.hashes | index($state) != null)
              and (.refusal.limit | type == "string" and length > 0)
            ' "$f" > /dev/null || { echo "FAIL: $row structural refusal evidence moved"; exit 1; }
          done
          # CG19 under the registry-mode cage is REFUSED at the state script
          # (A-015): the interface routes a processed request to its own
          # destination minus the tip and a refund to the address custody
          # records, so a crossed allocation -- one request's value routed to
          # another's target, or to a hook the mandate deleted -- is a routing
          # the cage refuses. Same structural refusal evidence as CG11/CG12.
          # jq expands its own --arg variables inside this program.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg state "$state_hash" '
            .outcome == "refused" and .venue == "node-submit"
            and (.rejected | test("^[0-9a-f]{64}$"))
            and .refusal.phase == "phase-2"
            and (.refusal.hashes | index($state) != null)
            and (.refusal.limit | type == "string" and length > 0)
          ' "${CONFORMANCE_RECEIPTS}"/receipt-CG19.json > /dev/null || { echo 'FAIL: CG19 structural refusal evidence moved'; exit 1; }
          grep -q '^control: CG11 control: nonempty fold accepted (tx=[0-9a-f]\{64\})' /tmp/generic-rows.log || { echo 'FAIL: CG11 accepting control txid missing'; exit 1; }
          grep -q '^control: CG12 control: exact 1:1 fold accepted (tx=[0-9a-f]\{64\})' /tmp/generic-rows.log || { echo 'FAIL: CG12 accepting control txid missing'; exit 1; }
          # 8. standalone rejected-floor control receipt mandatory:
          #    two nonempty obligations, ordered pair, paid-vs-owed,
          #    phase/hash/limit, both txids, counterpart, identity.
          c="${CONFORMANCE_RECEIPTS}/control-CG19-rejected-floor.json"
          test -f "$c" || { echo 'FAIL: missing CG19-rejected-floor control receipt'; exit 1; }
          # jq expands its own --arg/--slurpfile variables.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg base "$head_sha" --arg state "$state_hash" --slurpfile row "${CONFORMANCE_RECEIPTS}"/receipt-CG19.json '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def text: type == "string" and length > 0;
            .control == "CG19-rejected-floor" and .row == "CG19"
            and .base == $base and .dirty == false
            and .blueprint == $row[0].blueprint and .node == $row[0].node
            and .authority == $state and .actions == ["Rejected", "Rejected"]
            and (.obligations | length == 2)
            and (.obligations | all(.[]; (.owner | text) and (.owed | type == "number" and . > 1000)))
            and (."ordered-requests" | length == 2)
            and ([."ordered-requests"[] | {owner, owed}] == .obligations)
            and (."ordered-requests" | all(.[]; (.outref | text) and (.key | text)))
            and ([."ordered-requests"[].outref] | unique | length == 2)
            and ([.bounds.lowerSlot, .bounds.upperUnderpaid, .bounds.upperFunded] | all(.[]; text))
            and (.pairing | text)
            and .underpaid.outcome == "refused" and .underpaid.phase == "phase-2"
            and (.underpaid.hashes | index($state) != null)
            and (.underpaid.limit | text) and (.underpaid.txid | txid)
            and .underpaid.paid == [(.obligations[0].owed - 1000), .obligations[1].owed]
            and .funded.outcome == "accepted" and (.funded.txid | txid)
            and .funded.txid != .underpaid.txid
            and .funded.paid == [.obligations[].owed]
            and (.funded | .mem > 0 and .cpu > 0 and .size > 0)
          ' "$c" > /dev/null || { echo 'FAIL: CG19-rejected-floor pair evidence moved'; exit 1; }
          # 9. CG21 (#184): the insertActive edge observation, complete or
          #    the step fails. The loader already refuses an incomplete
          #    CG21 receipt; this asserts the same promises at the CI
          #    boundary, against the compiled blueprint's own hashes, so a
          #    loader that stopped checking cannot make the row pass here.
          #    #228's step registers an extra signer and both sides accept it.
          #    The delivery sent to another address and paid one lovelace short
          #    is refused by the state script and by the model, whose reason is
          #    the one the compiled Aiken suite names for the shape:
          #    onchain/validators/registry_rows.tests.ak
          #    t6_carrier_at_another_address_refuses (destination) and
          #    t6_underfunded_destination_refuses (deposit-returned); the same
          #    request untampered is accepted by both. The ledger's own reason
          #    is not observed: the validators are compiled without traces (#287).
          open_params="$(nix run --quiet nixpkgs#jq -- -er '[.validators[] | select(.title == "open.open.mint") | (.parameters // []) | length] | first' "$blueprint")"
          [ "$open_params" -eq 0 ] || { echo "FAIL: open.open.mint declares $open_params parameters; CG21 reports a parameterless open application"; exit 1; }
          e="${CONFORMANCE_RECEIPTS}/receipt-CG21.json"
          # jq expands its own --arg variables inside this program.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg state "$state_hash" '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def complete: (.compared | length) == 9 and (.unobserved | type) == "array"
              and (.perturbation.refused > 0);
            ([.steps[] | select(.tamper == "other-address") | .request][0]) as $tampered |
            .row == "CG21" and .outcome == "accepted"
            and .verdict == "agrees-with-model" and .venue == "node-submit"
            and (.steps | length) == 7
            and ([.steps[].tamper] == [null,null,null,"other-address","short-by-one",null,"extra-signer"])
            and all(.steps[]; .comparison == "agrees")
            and all(.steps[] | select(.tamper == null and .model.outcome == "accepted"
                    and .chain.outcome == "accepted");
                    (.chain.txid | txid) and complete)
            and ([.steps[] | select(.tamper == null and .model.outcome == "accepted"
                    and .chain.outcome == "accepted")]
                 | length) == 3
            and any(.steps[]; .tamper == "extra-signer" and .model.outcome == "accepted"
                    and .chain.outcome == "accepted" and (.chain.txid | txid)
                    and .differences == [{"observation":"tx","path":"signers"}])
            and any(.steps[]; .edge == "insertActive" and .tamper == null and .model.outcome == "refused"
                    and .model.reason == "key-exists"
                    and .chain.outcome == "refused" and (.chain.refusal.hashes | index($state) != null))
            and any(.steps[]; .tamper == "other-address" and .model.outcome == "refused"
                    and .model.reason == "destination"
                    and .chain.outcome == "refused" and (.chain.txid | txid)
                    and (.chain.refusal.hashes | index($state) != null))
            and any(.steps[]; .tamper == "short-by-one" and .model.outcome == "refused"
                    and .model.reason == "deposit-returned" and .request == $tampered
                    and .chain.outcome == "refused" and (.chain.txid | txid)
                    and (.chain.refusal.hashes | index($state) != null))
            and any(.steps[]; .tamper == null and .model.outcome == "accepted"
                    and .chain.outcome == "accepted" and .request == $tampered)
          ' "$e" > /dev/null || { echo 'FAIL: CG21 step evidence missing or incomplete'; exit 1; }
          echo 'GREEN = expected-debt assertion held: 11 rows executed on a clean candidate-bound tree; the registration steps, duplicate refusal and the tampered-payment controls are recorded, with held debt exactly CG11 CG12 CG19.'
          echo 'A GREEN STEP IS NOT A FULFILLED CONSUMER PROMISE: R5_plugin_pinned, R8_empty_fold_refused and R11_contribute_value stay unmet (upstream #100/#101); strict completion and release stay RED on that debt.'
      # Issue #69: canonical identity authentication. CA02 asserts
      # the ledger's acceptance of a rival registry from a second
      # seed — the settled finding, never relabelled as a refusal —
      # and the consumer's rejection of it on the derived name;
      # CA03 proves the name check is the discriminator; CA05 shows
      # no script executed when a forged output is created at the
      # canonical address.
      - name: Run the canonical-identity rows as a packaged app without a dev shell
        working-directory: conformance
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CA01 CA02 CA03 CA04 CA05 --receipts-dir "$CONFORMANCE_RECEIPTS"
          # exact CA04 derivation evidence: state arity-0 match,
          # request arity-2 distinct, corrupted refusal — off-chain
          # venue throughout, boot txid as provenance.
          nix run --quiet nixpkgs#jq -- -e '.verdict == "agrees-with-model" and .venue == "off-chain-identity (not phase-2)" and ([.derivation[] | .validator + "/" + .outcome] | sort == ["request.request/distinct", "state.state/match", "state.state/refused"])' "${CONFORMANCE_RECEIPTS}"/receipt-CA04.json > /dev/null || { echo 'FAIL: CA04 derivation evidence moved'; exit 1; }
      # Armed CA04 negative (NOTE-062/067, E18 venue): the same
      # checker demanding the corrupted derivation pass must fail
      # with the exact message. A control that cannot fail proves
      # nothing; this step fails if the run unexpectedly succeeds.
      - name: Prove the CA04 corrupted-derivation check can fail
        working-directory: conformance
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          armed_receipts="$(mktemp -d "$RUNNER_TEMP/conformance-armed.XXXXXX")"
          set +e
          CONFORMANCE_CONTROL=unapplied-address REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CA01 CA04 --receipts-dir "$armed_receipts" 2>&1 | tee /tmp/ca04-armed.log
          run_rc=${PIPESTATUS[0]}
          set -e
          [ "$run_rc" -ne 0 ] || { echo 'FAIL: armed CA04 negative unexpectedly passed'; exit 1; }
          grep -q 'CA04 ARMED (unapplied-address)' /tmp/ca04-armed.log || { echo 'FAIL: armed CA04 did not fail with the exact message'; exit 1; }
          echo 'ARMED = corrupted-derivation check proved able to fail.'
      # Issue #68: the serialization boundary — Haskell datum, redeemer
      # and parameter encodings against the compiled blueprint plus
      # compiled execution evidence, rather than a codec agreeing with
      # itself. Issue #157 split this family by edge; issue #183 cuts
      # the request wire to its edge index and RETURNS the three rows
      # that were waiting on that final wire. The session is now six:
      # CS01 and CS06 check the blueprint locally and need no node;
      # CS02, CS04, CS07 and CS08 execute on the devnet.
      #
      # Five agree with the model by being ACCEPTED. CS04 agrees with
      # it by being REFUSED — a tampered Modify index the cage must
      # reject — so the assertions below bind the VERDICT
      # (agrees-with-model) for every row and never the outcome. This
      # session still carries NO partial and NO held row, so it ends
      # ZERO, and any partial or held report in it is a failure rather
      # than expected debt.
      #
      # CS03 and CS05 stay out and stay unstubbed; they travel with
      # #177/#179.
      #
      # The assertion binds the terminal state this exact session
      # really prints — the devnet leg's own completion line and the
      # runner's exit line — then requires exactly the six CS receipt
      # IDs with no missing or extra receipt, each with its real
      # verdict, on a clean tree, bound to the candidate.
      - name: Run the serialization rows as a packaged app without a dev shell
        working-directory: conformance
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          set +e
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CS01 CS02 CS04 CS06 CS07 CS08 --receipts-dir "$CONFORMANCE_RECEIPTS" 2>&1 | tee /tmp/serialization-rows.log
          run_rc=${PIPESTATUS[0]}
          set -e
          echo "serialization session exit: $run_rc (expected: exactly 0 — every row agrees with the model, CS04 by refusing)"
          head_sha="$(git rev-parse HEAD)"
          # 1. the EXACT status of an all-accepted session, never a
          #    tolerated range: a partial or held session exits 1, and
          #    any other exit is an unexamined build/setup/crash.
          [ "$run_rc" -eq 0 ] || { echo "FAIL: serialization exit $run_rc is not the agrees-with-model exit 0"; exit 1; }
          # 2. complete terminal evidence for the session actually run:
          #    the CS devnet leg completes its four devnet rows
          #    (CS02, CS04, CS07, CS08)...
          grep -q 'complete: 4/4 rows ok' /tmp/serialization-rows.log || { echo 'FAIL: the CS devnet leg did not complete its four devnet rows (mid-run failure or crash)'; exit 1; }
          #    ...and the runner reports its own success status line
          grep -q '^exit_status: 0$' /tmp/serialization-rows.log || { echo 'FAIL: the runner did not report exit_status: 0'; exit 1; }
          #    ...with neither debt report present: a partial or a held
          #    row must never be read as this session's pass.
          if grep -q 'ROWS PARTIAL' /tmp/serialization-rows.log; then
            echo 'FAIL: a row reported PARTIAL in a session whose rows are all accepted'
            exit 1
          fi
          if grep -q 'ROWS THE RUN CANNOT REPORT AS PASSING' /tmp/serialization-rows.log; then
            echo 'FAIL: a row reported held or failing in a session whose rows are all accepted'
            exit 1
          fi
          # 3. exactly the six CS receipt IDs, no missing and no extra
          printf '%s\n' CS01 CS02 CS04 CS06 CS07 CS08 | sort > /tmp/expected-cs.txt
          nix run --quiet nixpkgs#jq -- -r '.row' "${CONFORMANCE_RECEIPTS}"/receipt-CS*.json | sort > /tmp/receipt-cs.txt
          #    Compared with bash builtins, not diff: this step runs a packaged
          #    app without a dev shell, and an absent diff previously reported
          #    'receipt set mismatch' — an unavailable tool misattributed as a
          #    substantive failure. No external command, so no such path remains.
          if [ "$(</tmp/expected-cs.txt)" != "$(</tmp/receipt-cs.txt)" ]; then
            echo 'FAIL: CS receipt set mismatch (missing or extra row)'
            echo '--- expected ---'; while IFS= read -r l; do echo "$l"; done < /tmp/expected-cs.txt
            echo '--- receipts ---'; while IFS= read -r l; do echo "$l"; done < /tmp/receipt-cs.txt
            exit 1
          fi
          # 4. every row its real verdict — agrees-with-model, whether
          #    the row agrees by accepting or, for CS04, by refusing —
          #    never partial and never held, on a clean tree, bound to
          #    this candidate
          for row in CS01 CS02 CS04 CS06 CS07 CS08; do
            f="${CONFORMANCE_RECEIPTS}/receipt-$row.json"
            test -f "$f" || { echo "FAIL: missing receipt for $row"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.verdict' "$f")" = "agrees-with-model" ] || { echo "FAIL: unexpected verdict for $row"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.dirty' "$f")" = "false" ] || { echo "FAIL: $row receipt records a dirty tree"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.base' "$f")" = "$head_sha" ] || { echo "FAIL: $row not bound to $head_sha"; exit 1; }
          done
          echo 'GREEN = agrees-with-model assertion held: CS01 CS02 CS04 CS06 CS07 CS08 executed on a clean candidate-bound tree, every verdict agrees-with-model (CS04 by refusing), no partial and no held row in the session.'
      # Loader and inventory enforcement over the session receipts:
      # the loader validates every receipt (constructor accounting
      # included — a false success or an omitted constructor fails
      # here), and the inventory must render each of this ticket's six
      # serialization rows executed. Neither an arbitrary exit1 nor
      # grep alone is acceptance: the assertions above bind the
      # verdicts. NOTE-058: the state assertion parses the TSV
      # (column 4), never a substring. Non-vacuity is two-sided —
      # CS01, CS02, CS04, CS06, CS07 and CS08 must each appear exactly
      # once and read executed, and no other CS row may render executed
      # or partial, so a missing, duplicated or extra receipt fails
      # here. The quantity is what the assertion is over: the counters
      # are per id so one row rendering twice cannot pay for another
      # rendering not at all.
      - name: Enforce receipt accounting and inventory rendering
        working-directory: conformance
        run: |
          nix run --quiet .#conformance -- list --receipts "$CONFORMANCE_RECEIPTS" 2>&1 | tee /tmp/inventory-render.log
          c1=0 c2=0 c4=0 c6=0 c7=0 c8=0 extra=""
          while IFS= read -r row || [[ -n "$row" ]]; do
            id=${row%%$'\t'*}
            [[ "$id" == CS* ]] || continue
            # Preserve empty TSV fields; whitespace IFS would collapse them.
            for column in 1 2 3; do
              [[ "$row" == *$'\t'* ]] || { echo "FAIL: $id missing state column after field $column"; exit 1; }
              row=${row#*$'\t'}
            done
            state=${row%%$'\t'*}
            case "$id" in
              CS01) c1=$((c1 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS01 state: $state"; exit 1; } ;;
              CS02) c2=$((c2 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS02 state: $state"; exit 1; } ;;
              CS04) c4=$((c4 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS04 state: $state"; exit 1; } ;;
              CS06) c6=$((c6 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS06 state: $state"; exit 1; } ;;
              CS07) c7=$((c7 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS07 state: $state"; exit 1; } ;;
              CS08) c8=$((c8 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS08 state: $state"; exit 1; } ;;
              *) if [[ "$state" == executed || "$state" == partial ]]; then extra="$extra $id"; fi ;;
            esac
          done < /tmp/inventory-render.log
          [[ "$c1" == 1 ]] || { echo "FAIL: CS01 rows: $c1"; exit 1; }
          [[ "$c2" == 1 ]] || { echo "FAIL: CS02 rows: $c2"; exit 1; }
          [[ "$c4" == 1 ]] || { echo "FAIL: CS04 rows: $c4"; exit 1; }
          [[ "$c6" == 1 ]] || { echo "FAIL: CS06 rows: $c6"; exit 1; }
          [[ "$c7" == 1 ]] || { echo "FAIL: CS07 rows: $c7"; exit 1; }
          [[ "$c8" == 1 ]] || { echo "FAIL: CS08 rows: $c8"; exit 1; }
          [[ -z "$extra" ]] || { echo "FAIL: serialization rows outside this ticket's set render as run:$extra"; exit 1; }
          echo 'INVENTORY = CS01/CS02/CS04/CS06/CS07/CS08 executed (column 4, each exactly once), no other CS row run, loader accepted the accounting.'
      # CS04, CS07 and CS08 are back in the run list above, re-cut on
      # the final request wire (#183). CS03 and CS05 still travel with
      # #177/#179 and are still not stubbed.
      #
      # STILL RETIRED, still not stubbed: the step "CS07 missing-Fork
      # control fails". It armed a control over the byte-level shape of
      # the PREVIOUS cage wire — a request value the edge wire cannot
      # express — so returning CS07 does not return that control. It is
      # removed outright: no stub, no skip, no echo standing in for it.
      # What CS07 asserts now is the proof shape its own row builds.
      - name: Preserve candidate-bound conformance receipts
        if: always() && env.CONFORMANCE_RECEIPTS != ''
        uses: actions/upload-artifact@v4
        with:
          name: conformance-receipts
          path: ${{ env.CONFORMANCE_RECEIPTS }}
          if-no-files-found: error
  # Issue #80: the theorem-coverage gate. The ratchet (per-obligation,
  # no offsetting) and the full-completion gate (strict, all axes zero) are
  # two distinct results and both run. At the current honest baseline the
  # completion gate REFUSES: mapping, implementation-layer and unclassified
  # debt are nonzero, and an incremental PR must not make it pass. The
  # negated step below asserts exactly that — if the gate ever exits zero
  # here, the record claims completion and this workflow must be flipped
  # deliberately, with the owner's acceptance, not silently.
  coverage-gate:
    name: Theorem coverage gate — inventory, ratchet and completion as distinct results
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Gate test suite incl. every armed failure control (frozen snapshot)
        working-directory: conformance
        run: nix build --quiet --no-link .#coverageGateTests
      - name: Gate verdicts against the frozen snapshot (inventory, ratchet, honest refusal)
        working-directory: conformance
        run: nix build --quiet --no-link .#coverageGateSnapshot
      - name: Inventory — reconcile manifests and discover the obligation population
        run: nix run --quiet ./conformance#coverage-gate -- --root . inventory
      - name: Ratchet — per-obligation regression against the protected base (must pass)
        run: nix run --quiet ./conformance#coverage-gate -- --root . ratchet
      - name: Completion — must refuse while debt is nonzero (flipping this is claiming completion)
        run: |
          if nix run --quiet ./conformance#coverage-gate -- --root . completion; then
            echo "COMPLETION claimed complete; if this is real, flip this step deliberately"
            exit 1
          else
            rc=$?
            test "$rc" -eq 1 || { echo "completion gate failed closed (exit $rc), not INCOMPLETE"; exit 1; }
            echo "COMPLETION: INCOMPLETE — the honest nonzero baseline, reported as its own result"
          fi
