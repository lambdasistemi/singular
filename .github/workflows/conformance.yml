name: Conformance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conformance/**'
      - 'onchain/**'
      - 'lean/**'
      - 'tools/**'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Workflow parses, lints clean, owned docs page bound
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # A workflow that cannot be parsed cannot fail loudly: every
      # workflow file must parse before anything else runs. yq-go
      # comes from nixpkgs so the check needs nothing the runner
      # lacks.
      - name: Every workflow file parses as YAML
        run: |
          for f in .github/workflows/*.yml; do nix run --quiet nixpkgs#yq-go -- eval '.' "$f" > /dev/null; done
      # Declare the repository's self-hosted runner label, then
      # require actionlint itself to succeed, including shellcheck.
      - name: actionlint carries no new findings
        run: |
          printf 'self-hosted-runner:\n  labels: [nixos]\n' > "$RUNNER_TEMP/conformance-actionlint.yaml"
          nix run --quiet nixpkgs#actionlint -- -config-file "$RUNNER_TEMP/conformance-actionlint.yaml" .github/workflows/conformance.yml
      # The owned docs page keeps its speech companion: present and
      # covering its headings, bound to its hash. The repository's
      # own docs CI (just ci) remains the backstop for doc-only
      # changes outside this workflow's path filter.
      - name: Owned docs page passes the presentation gate
        run: nix develop --quiet --command python3 tools/check_presentation.py --front README.md --register docs/model-ledger.md --register docs/theorems.md --register docs/mutants.md docs/consumer-conformance.md
  format-check:
    name: Conformance Haskell format and lint check
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #278 S2: the Conformance Haskell tree under the house Fourmolu
      # configuration — the one committed fourmolu.yaml at the repository
      # root, passed explicitly so a missing configuration fails loudly
      # instead of falling back to Fourmolu defaults. The app discovers
      # its extent from the Cabal manifests at check time (the Conformance
      # stanzas plus the #80 evaluation spike), runs the pinned Fourmolu
      # its lock resolves, and checks the FLAKE SOURCE (a store copy), so
      # the bytes it checks are candidate-bound — the same shape as the
      # off-chain lint app. The whole-tree checkout-context carrier (both
      # Haskell trees, same configuration, same extent) is `just
      # format-check` inside the dev-shell job's `just ci`; the negative
      # and positive controls run there too via `just format-controls`.
      - run: nix run --quiet .#format-check
        working-directory: conformance
      # #278 S3: HLint over the same discovered extent, with the pinned
      # HLint the off-chain lint resolves; no exclusions, no ignore file.
      - run: nix run --quiet .#hlint-check
        working-directory: conformance
  conformance:
    name: Generic, canonical-identity and serialization rows on a real devnet
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The registry rows as programs over the registry's operations
      # (#232), each in registries of its own on a real devnet, every
      # request and batch compared with the model: insert, update,
      # delete, re-insert after delete, the insert on an occupied key,
      # a retraction in phase 2, a reject after the windows (CG01-CG06,
      # CG08), CG09 unmet by ruling (#320) with its recorded
      # refund-position divergence (#361), the held rows CG11/CG19, and
      # the registration chapter CG21. CG10 and CG12, which the model
      # cannot express (#346, #345), run their own refusals and stay
      # unmet by ruling. CG13, CG16, CG17, CG18 and CG20 are NOT run:
      # the registry has no owner role, no sweep and no termination
      # (ownerless-registry ruling, f3a68b1b); CG14/CG15 are retired:
      # the registry interface has no stake_script hook. Each is
      # published outside the model's vocabulary with its reason.
      #
      # A session containing held or unmet rows ends NON-ZERO by design
      # (neither may ever read as a pass). Per the A-001 ruling this step
      # never treats that exit — or any error label — as success: the
      # expected-debt assertion below reads the session's ACTUAL
      # results and demands exactly the thirteen rows, exactly the
      # expected verdict per row (receipts), no divergence, and a
      # non-zero exit accounted for by exactly the held rows CG11
      # CG19 and the unmet rows CG09 CG10 CG12, and nothing else. A GREEN STEP IS NOT A FULFILLED
      # CONSUMER PROMISE: R5/R8/R11 stay unmet (upstream #100/#101);
      # strict completion and release stay RED on that debt. Issue #69 then runs the CA
      # rows as their own session: the consumer's authentication of
      # the canonical registry identity, with the rival the ledger
      # cannot refuse executed beside it. The unit suite (inventory
      # denominator, receipt overlay, refusal matcher, authenticator
      # decisions) runs first and fails fast; the devnet runs are
      # the expensive gate. The blueprint is built from the
      # checked-out commit and passed at run time, so freshness is
      # carried by the recipe, not the ordering edge. The runner
      # sets its own unique TMPDIR and never touches the default
      # path, so concurrent devnet lanes keep their databases.
      #
      # Issue #287: the harness rebuilds the registry validators from
      # ../onchain with traces, to replay a live refusal and read the
      # reason the deployed bytes cannot print. The check rebuilds them
      # untraced with the same toolchain and requires every hash in
      # onchain/script-identity.json, then requires the traced build to
      # name the same validators and schemas with at least one hash
      # changed by the trace flags; four controls show each comparison
      # refusing. The traced blueprint the runner receives is built
      # behind this check.
      - name: Check the traced registry build against the deployed hashes
        working-directory: conformance
        run: nix build --quiet --no-link .#registry-blueprint-correspondence
      # Issue #287: a dedicated row that fails must keep its exit and leave
      # its receipts and replay index where the upload below collects them.
      # The control runs the steps' own wrapper with a stand-in failing row,
      # and refuses copies of it with the publication removed or the receipts
      # discarded.
      - name: Show a failing dedicated row keeps its exit and its replay index
        working-directory: conformance
        run: bash test/ci/dedicated-row-control.sh
      - name: Run the unit suite as a packaged app without a dev shell
        working-directory: conformance
        run: nix run --quiet .#conformance-tests
      - name: List the inventory as a packaged app without a dev shell
        working-directory: conformance
        run: nix run --quiet .#conformance -- list
      # Read all eleven model-and-chain step records from the retirement
      # receipt. The refusals must carry state-script attribution, and
      # every accepted step must compare the declared surface and reject
      # discovered-value perturbations. The separate registry makes the
      # unknown-key attempt independent of the Absent refusal. The two
      # tampered deletions, paying the deposit back one lovelace short and
      # to another address, are refused by the state script and by the
      # model, whose reason is the one the compiled Aiken suite names for
      # the shape: onchain/validators/deposit_exits.tests.ak
      # e5_deposit_one_lovelace_short_refuses and
      # e5_deposit_diverted_to_another_address_refuses (deposit-returned).
      # The ledger's own reason comes from the traced replay of each refused
      # transaction (#287) and must equal the model's.
      - name: Run the dedicated CG22 retirement row as a packaged app
        run: |
          set -e
          cd conformance
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # The row runs through the wrapper the retention control executes.
          CONFORMANCE_DEDICATED_RECEIPTS="${CONFORMANCE_DEDICATED_RECEIPTS:-$(mktemp -d "$RUNNER_TEMP/conformance-dedicated.XXXXXX")}"
          export CONFORMANCE_DEDICATED_RECEIPTS
          receipts="$CONFORMANCE_DEDICATED_RECEIPTS/CG22"
          bash test/ci/dedicated-row.sh CG22 -- env REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG22
          head_sha="$(git rev-parse HEAD)"
          f="$receipts/receipt-CG22.json"
          test -f "$f" || { echo 'FAIL: missing CG22 receipt'; exit 1; }
          state_hash="$(nix run --quiet nixpkgs#jq -- -er '.validators[] | select(.title == "state.state.spend" and ((.parameters // []) | length) == 0) | .hash' "$blueprint")"
          # jq expands its own --arg variables inside this program.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg base "$head_sha" --arg state "$state_hash" '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def text: type == "string" and length > 0;
            def complete: .comparison == "agrees" and .tamper == null
              and (.compared | length) == 9 and .perturbation.refused > 0;
            .row == "CG22"
            and .verdict == "agrees-with-model"
            and .base == $base and .dirty == false
            and (.blueprint | text) and (.node | text)
            and (.steps | length) == 11
            and ([.steps[].edge] == ["insertActive","updateTerminal","insertAbsent","updateTerminal","insertActive","updateTerminal","updateTerminal","insertActive","deleteActive","deleteActive","deleteActive"])
            and ([.steps[].tamper] == [null,null,null,null,null,null,null,null,"short-by-one","other-address",null])
            and ([.steps[].model.outcome] == ["accepted","accepted","accepted","refused","accepted","accepted","refused","accepted","refused","refused","accepted"])
            and ([.steps[].chain.outcome] == ["accepted","accepted","accepted","refused","accepted","accepted","refused","accepted","refused","refused","accepted"])
            and all(.steps[]; .comparison == "agrees")
            and .steps[8].model.reason == "deposit-returned"
            and .steps[9].model.reason == "deposit-returned"
            and all(.steps[8,9]; (.chain.txid | txid) and (.chain.refusal.hashes | index($state) != null))
            and ([.steps[8,9,10].request] | unique | length) == 1
            and .steps[10].registry == .steps[0].registry
            and .steps[7].registry == .steps[0].registry
            and all(.steps[] | select(.model.outcome == "accepted"); complete and (.chain.txid | txid))
            and all(.steps[] | select(.model.outcome == "refused");
              (.chain.txid | txid) and (.chain.refusal.hashes | length) > 0)
            and .steps[3].model.reason == "not-booked"
            and .steps[6].model.reason == "key-unknown"
            and .steps[1].perturbation.byObservation.mint > 0
            and .steps[1].perturbation.byObservation.leaf > 0
            and .steps[0].registry == .steps[1].registry
            and .steps[1].registry == .steps[2].registry
            and .steps[2].registry == .steps[3].registry
            and .steps[4].registry == .steps[5].registry
            and .steps[5].registry == .steps[6].registry
            and .steps[0].registry != .steps[4].registry
            and (.transactions | length) == 7
          ' "$f" > /dev/null || { echo 'FAIL: CG22 retirement evidence moved'; exit 1; }
          bash test/ci/replay-evidence.sh steps "$f" || { echo 'FAIL: CG22 refused steps lack the traced replay of their reason'; exit 1; }
          # #326 R9: the dedicated rows' receipts are kept together as the
          # conformance-story-receipts artifact, beside the generic session's.
          STORY_RECEIPTS="$(mktemp -d "$RUNNER_TEMP/story-receipts.XXXXXX")"
          printf 'STORY_RECEIPTS=%s\n' "$STORY_RECEIPTS" >> "$GITHUB_ENV"
          cp "$f" "$STORY_RECEIPTS/"
      # Read the eight step records the exit controls write as a row of
      # their own, apart from the retirement so that each receipt is
      # written under the size bound. Requests leave the queue unfolded,
      # each exit named by the step. In a registry of its own, a reject
      # refunding the owner one lovelace short and to another key is
      # refused by the state script and by the model for deposit-returned,
      # the name onchain/validators/deposit_exits.tests.ak
      # reject_refund_one_lovelace_short_refuses_by_name and
      # reject_refund_to_another_key_refuses_by_name assert; the untampered
      # reject is accepted by both. In another registry, a retraction returning one
      # lovelace short, to another key and bound to another output reference
      # is refused by the request script and by the model for
      # deposit-returned, as onchain/validators/cage_retract.tests.ak
      # retract_held_short_by_one_refuses, retract_held_wrong_owner_refuses
      # and retract_wrong_reference_refuses assert; one spending the
      # registry's state beside it is refused for retract-state-spent, as
      # retract_beside_a_fold_refuses asserts; the untampered retraction,
      # bound to the request's own output reference and signed by its owner,
      # is accepted by both. An unsigned insertion and an update retraction
      # are also refused at admission, compared with the model. Timing refusals
      # run in the separate finite-window chapter below.
      # The ledger's own reason comes from the traced replay of each refused
      # transaction (#287) and must equal the model's.
      - name: Run the dedicated CG23 exit row as a packaged app
        run: |
          set -e
          cd conformance
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # The row runs through the wrapper the retention control executes.
          CONFORMANCE_DEDICATED_RECEIPTS="${CONFORMANCE_DEDICATED_RECEIPTS:-$(mktemp -d "$RUNNER_TEMP/conformance-dedicated.XXXXXX")}"
          export CONFORMANCE_DEDICATED_RECEIPTS
          receipts="$CONFORMANCE_DEDICATED_RECEIPTS/CG23"
          bash test/ci/dedicated-row.sh CG23 -- env REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG23
          head_sha="$(git rev-parse HEAD)"
          f="$receipts/receipt-CG23.json"
          test -f "$f" || { echo 'FAIL: missing CG23 receipt'; exit 1; }
          # The margin is nine tenths of the receipt bound (18 432 bytes): with the
          # traced replay of its refusals CG23 measured 15 214 bytes (#287).
          test "$(wc -c < "$f")" -le 16588 || { echo "FAIL: CG23 receipt exceeds its margin"; exit 1; }
          state_hash="$(nix run --quiet nixpkgs#jq -- -er '.validators[] | select(.title == "state.state.spend" and ((.parameters // []) | length) == 0) | .hash' "$blueprint")"
          # jq expands its own --arg variables inside this program.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg base "$head_sha" --arg state "$state_hash" '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def text: type == "string" and length > 0;
            def complete: .comparison == "agrees" and .tamper == null
              and (.compared | length) == 9 and .perturbation.refused > 0;
            .row == "CG23"
            and .verdict == "agrees-with-model"
            and .base == $base and .dirty == false
            and (.blueprint | text) and (.node | text)
            and (.steps | length) == 10
            and ([.steps[].edge] == ["insertActive","insertActive","insertActive","insertActive","insertActive","insertActive","insertActive","updateTerminal","insertActive","insertActive"])
            and ([.steps[].exit] == ["reject","reject","reject","retract","retract","retract","retract","retract","retract","retract"])
            and ([.steps[].tamper] == ["short-by-one","other-address",null,"short-by-one","other-address","other-reference","state-spent",null,"unsigned",null])
            and ([.steps[].model.outcome] == ["refused","refused","accepted","refused","refused","refused","refused","refused","refused","accepted"])
            and ([.steps[].chain.outcome] == ["refused","refused","accepted","refused","refused","refused","refused","refused","refused","accepted"])
            and all(.steps[]; .comparison == "agrees")
            and all(.steps[] | select(.model.outcome == "accepted"); complete and (.chain.txid | txid))
            and all(.steps[] | select(.model.outcome == "refused");
              (.chain.txid | txid) and (.chain.refusal.hashes | length) > 0)
            and all(.steps[0,1]; .model.reason == "deposit-returned"
              and (.chain.refusal.hashes | index($state) != null)
              and (.chain.refusal.scripts | index("state") != null))
            and all(.steps[3,4,5]; .model.reason == "deposit-returned"
              and (.chain.refusal.scripts | index("request") != null))
            and .steps[6].model.reason == "retract-state-spent"
            and (.steps[6].chain.refusal.scripts | index("request") != null)
            and ([.steps[0,1,2].registry] | unique | length) == 1
            and ([.steps[3,4,5,6,7,8,9].registry] | unique | length) == 1
            and .steps[0].registry != .steps[3].registry
            and all(.steps[] | select(.exit == "retract");
              (.request.reference | type) == "number")
            and ([.steps[3,4,5,6,7,8,9].request.reference] | unique | length) == 6
            and .steps[7].model.reason == "withdraw-insert-only"
            and .steps[8].model.reason == "retract-owner"
            and all(.steps[7,8]; .requestScript as $request |
              .chain.outcome == "refused"
              and ($request | type == "string" and test("^[0-9a-f]{56}$"))
              and (.chain.refusal.hashes | index($request) != null)
              and (.chain.refusal.scripts | index("request") != null))
            and .steps[8].request == .steps[9].request
            and (.steps[8].witness | del(.signatories)) == (.steps[9].witness | del(.signatories))
            and .steps[8].witness.signatories == []
            and (.steps[9] | .request.owner as $owner | .witness.signatories | index($owner) != null)
            and (.transactions | length) == 2
          ' "$f" > /dev/null || { echo 'FAIL: CG23 exit evidence moved'; exit 1; }
          bash test/ci/replay-evidence.sh steps "$f" || { echo 'FAIL: CG23 refused steps lack the traced replay of their reason'; exit 1; }
          cp "$f" "$STORY_RECEIPTS/"
      # CG24 (#320): a folder rejects a pending request before its owner's
      # retraction deadline. Two insertion requests are booked together in a
      # registry of their own; the first is rejected inside its processing
      # window, the second inside its owner's retraction window. In each window
      # a reject refunding the owner one lovelace short and one refunding
      # another key are refused by the chain and by the model, and the
      # untampered reject is accepted by both, refunding the owner the deposit
      # and leaving the registry state as it was. Each refusal is attributed by
      # the state script's hash, and the reason the traced replay of the
      # refused transaction admits must be the model's `deposit-returned`
      # (#287), the name the compiled Aiken suite also asserts for the same
      # refunds in the same windows (onchain/validators/deposit_exits.tests.ak
      # early_reject_refund_one_lovelace_short_in_the_processing_window_refuses_by_name,
      # early_reject_refund_to_another_key_in_the_processing_window_refuses_by_name
      # and their retraction-window twins).
      - name: Run the dedicated CG24 early rejection row as a packaged app
        run: |
          set -eo pipefail
          cd conformance
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # The row runs through the wrapper the retention control executes.
          CONFORMANCE_DEDICATED_RECEIPTS="${CONFORMANCE_DEDICATED_RECEIPTS:-$(mktemp -d "$RUNNER_TEMP/conformance-dedicated.XXXXXX")}"
          export CONFORMANCE_DEDICATED_RECEIPTS
          receipts="$CONFORMANCE_DEDICATED_RECEIPTS/CG24"
          log="$RUNNER_TEMP/cg24.log"
          bash test/ci/dedicated-row.sh CG24 -- env REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG24 2>&1 | tee "$log"
          head_sha="$(git rev-parse HEAD)"
          f="$receipts/receipt-CG24.json"
          test -f "$f" || { echo 'FAIL: missing CG24 receipt'; exit 1; }
          # Nine tenths of the receipt bound (18 432 bytes), as for CG23.
          test "$(wc -c < "$f")" -le 16588 || { echo "FAIL: CG24 receipt exceeds its margin"; exit 1; }
          state_hash="$(nix run --quiet nixpkgs#jq -- -er '.validators[] | select(.title == "state.state.spend" and ((.parameters // []) | length) == 0) | .hash' "$blueprint")"
          # jq expands its own --arg variables inside this program.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg base "$head_sha" --arg state "$state_hash" '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def text: type == "string" and length > 0;
            def complete: .comparison == "agrees" and .tamper == null
              and (.compared | length) == 9 and .perturbation.refused > 0;
            .row == "CG24"
            and .verdict == "agrees-with-model"
            and .base == $base and .dirty == false
            and (.blueprint | text) and (.node | text)
            and (.steps | length) == 6
            and all(.steps[]; .edge == "insertActive" and .exit == "reject")
            and ([.steps[].tamper] == ["short-by-one","other-address",null,"short-by-one","other-address",null])
            and ([.steps[].model.outcome] == ["refused","refused","accepted","refused","refused","accepted"])
            and ([.steps[].chain.outcome] == ["refused","refused","accepted","refused","refused","accepted"])
            and all(.steps[]; .comparison == "agrees")
            and all(.steps[] | select(.model.outcome == "accepted"); complete and (.chain.txid | txid))
            and all(.steps[] | select(.model.outcome == "refused");
              .model.reason == "deposit-returned"
              and (.chain.txid | txid)
              and (.chain.refusal.hashes | index($state) != null)
              and (.chain.refusal.scripts | index("state") != null))
            and ([.steps[].registry] | unique | length) == 1
            and ([.steps[0,1,2].request] | unique | length) == 1
            and ([.steps[3,4,5].request] | unique | length) == 1
            and .steps[0].request != .steps[3].request
            and (.transactions | length) == 2
          ' "$f" > /dev/null || { echo 'FAIL: CG24 early rejection evidence moved'; exit 1; }
          # Each reject is placed in a named window; the interpreter refuses to
          # submit outside it. The run log states each placement with the
          # transaction's validity interval and the window it lies in.
          p1="$(grep -c "^placement: CG24 reject in the processing window validity=\[[0-9]*,[0-9]*) window=\[[0-9]*,[0-9]*) tx=[0-9a-f]\{64\}$" "$log" || true)"
          p2="$(grep -c "^placement: CG24 reject in the owner's retraction window validity=\[[0-9]*,[0-9]*) window=\[[0-9]*,[0-9]*) tx=[0-9a-f]\{64\}$" "$log" || true)"
          if [ "$p1" -ne 3 ] || [ "$p2" -ne 3 ]; then
            echo "FAIL: CG24 placements moved: processing=$p1 retraction=$p2, expected 3 and 3"
            exit 1
          fi
          bash test/ci/replay-evidence.sh steps "$f" || { echo 'FAIL: CG24 refused steps lack the traced replay of their reason'; exit 1; }
          cp "$f" "$STORY_RECEIPTS/"
          echo 'GREEN = early rejection held: inside the processing window and inside the retraction window, the untampered reject is accepted by the chain and the model, refunding the owner and leaving the state as it was; the short and misdirected refunds are refused by both for deposit-returned. The consumer R9_reject_needs_rejectable stays unmet (CG09, unmet-by-ruling).'
      # The timing refusals are compared in their own finite-window story.
      # The exit chapter above compares the other retraction admission refusals.
      - name: Run the retraction window as a packaged app
        run: |
          set -e
          cd conformance
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # The row runs through the wrapper the retention control executes.
          CONFORMANCE_DEDICATED_RECEIPTS="${CONFORMANCE_DEDICATED_RECEIPTS:-$(mktemp -d "$RUNNER_TEMP/conformance-dedicated.XXXXXX")}"
          export CONFORMANCE_DEDICATED_RECEIPTS
          receipts="$CONFORMANCE_DEDICATED_RECEIPTS/CG07"
          bash test/ci/dedicated-row.sh CG07 -- env REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG07
          head_sha="$(git rev-parse HEAD)"
          f="$receipts/receipt-CG07.json"
          test -f "$f" || { echo 'FAIL: missing retraction window receipt'; exit 1; }
          # Nine tenths of the receipt bound (18 432 bytes), as for CG23.
          test "$(wc -c < "$f")" -le 16588 || { echo 'FAIL: retraction window receipt exceeds its margin'; exit 1; }
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e --arg base "$head_sha" '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            .row == "CG07" and .verdict == "agrees-with-model"
            and .base == $base and .dirty == false
            and (.steps | length) == 3
            and ([.steps[].edge] == ["insertActive","insertActive","insertActive"])
            and ([.steps[].exit] == ["retract","retract","retract"])
            and ([.steps[].tamper] == ["before-phase-2",null,"after-phase-2"])
            and ([.steps[].model.outcome] == ["refused","accepted","refused"])
            and ([.steps[].chain.outcome] == ["refused","accepted","refused"])
            and all(.steps[]; .comparison == "agrees" and (.chain.txid | txid))
            and all(.steps[0,2]; .requestScript as $request |
              .model.reason == "not-phase2"
              and ($request | type == "string" and test("^[0-9a-f]{56}$"))
              and (.chain.refusal.hashes | index($request) != null)
              and (.chain.refusal.scripts | index("request") != null))
            and all(.steps[]; .request.owner as $owner |
              (.witness.signatories | index($owner) != null)
              and (.witness.validFrom | type) == "number"
              and (.witness.validTo | type) == "number"
              and .witness.validFrom < .witness.validTo)
            and ([.steps[].registry] | unique | length) == 1
            and .steps[0].request == .steps[1].request
            and .steps[0].request.owner == .steps[2].request.owner
            and .steps[0].request.reference != .steps[2].request.reference
            and (.steps[1].compared | length) == 9
            and .steps[1].perturbation.refused > 0
            and .transactions == [.steps[1].chain.txid]
          ' "$f" > /dev/null || { echo 'FAIL: retraction window evidence moved'; exit 1; }
          bash test/ci/replay-evidence.sh steps "$f" || { echo 'FAIL: retraction window refused steps lack the traced replay of their reason'; exit 1; }
          cp "$f" "$STORY_RECEIPTS/"
      # #287: the wrong-reason control. The retraction window runs again with
      # the model's reason for its first compared step replaced by another
      # valid reason (CONFORMANCE_REASON_CONTROL=ROW:STEP:REASON). The row must
      # fail naming the reason the traced replay admitted and the replaced
      # one, write no receipt, and keep the differing comparison in its replay
      # index. The restored leg is the retraction window step above: the same
      # row at this head, without the control, passing.
      - name: Show a wrong model reason fails the row naming both reasons
        working-directory: conformance
        run: |
          set -e
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          receipts="$(mktemp -d "$RUNNER_TEMP/conformance-reason-control.XXXXXX")"
          set +e
          CONFORMANCE_REASON_CONTROL=CG07:0:retract-owner REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CG07 --receipts-dir "$receipts" 2>&1 | tee /tmp/reason-control.log
          run_rc=${PIPESTATUS[0]}
          set -e
          [ "$run_rc" -eq 1 ] || { echo "FAIL: the altered row exited $run_rc, not the handled failure 1"; exit 1; }
          grep -q 'model and chain refuse for different reasons for retract at window-first: chain=not-phase2 lean=retract-owner' /tmp/reason-control.log || { echo 'FAIL: the altered row did not fail naming both reasons'; exit 1; }
          test ! -e "$receipts/receipt-CG07.json" || { echo 'FAIL: the altered row wrote a receipt'; exit 1; }
          nix run --quiet nixpkgs#jq -- -e 'any(.[]; .kind == "refusal" and .comparison == "differs" and .modelReason == "retract-owner")' "$receipts/replay/index.json" > /dev/null || { echo 'FAIL: the replay index lost the differing comparison'; exit 1; }
      - name: Run the generic rows as a packaged app without a dev shell
        working-directory: conformance
        run: bash ../.github/scripts/ci_generic_rows.sh
      # Issue #69: canonical identity authentication. CA02 asserts
      # the ledger's acceptance of a rival registry from a second
      # seed — the settled finding, never relabelled as a refusal —
      # and the consumer's rejection of it on the derived name;
      # CA03 proves the name check is the discriminator; CA05 shows
      # no script executed when a forged output is created at the
      # canonical address.
      - name: Run the canonical-identity rows as a packaged app without a dev shell
        working-directory: conformance
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CA01 CA02 CA03 CA04 CA05 --receipts-dir "$CONFORMANCE_RECEIPTS"
          # exact CA04 derivation evidence: state arity-0 match,
          # request arity-2 distinct, corrupted refusal — off-chain
          # venue throughout, boot txid as provenance.
          nix run --quiet nixpkgs#jq -- -e '.verdict == "agrees-with-model" and .venue == "off-chain-identity (not phase-2)" and ([.derivation[] | .validator + "/" + .outcome] | sort == ["request.request/distinct", "state.state/match", "state.state/refused"])' "${CONFORMANCE_RECEIPTS}"/receipt-CA04.json > /dev/null || { echo 'FAIL: CA04 derivation evidence moved'; exit 1; }
      # Armed CA04 negative (NOTE-062/067, E18 venue): the same
      # checker demanding the corrupted derivation pass must fail
      # with the exact message. A control that cannot fail proves
      # nothing; this step fails if the run unexpectedly succeeds.
      - name: Prove the CA04 corrupted-derivation check can fail
        working-directory: conformance
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          armed_receipts="$(mktemp -d "$RUNNER_TEMP/conformance-armed.XXXXXX")"
          set +e
          CONFORMANCE_CONTROL=unapplied-address REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CA01 CA04 --receipts-dir "$armed_receipts" 2>&1 | tee /tmp/ca04-armed.log
          run_rc=${PIPESTATUS[0]}
          set -e
          [ "$run_rc" -ne 0 ] || { echo 'FAIL: armed CA04 negative unexpectedly passed'; exit 1; }
          grep -q 'CA04 ARMED (unapplied-address)' /tmp/ca04-armed.log || { echo 'FAIL: armed CA04 did not fail with the exact message'; exit 1; }
          echo 'ARMED = corrupted-derivation check proved able to fail.'
      # Issue #68: the serialization boundary — Haskell datum, redeemer
      # and parameter encodings against the compiled blueprint plus
      # compiled execution evidence, rather than a codec agreeing with
      # itself. Issue #157 split this family by edge; issue #183 cuts
      # the request wire to its edge index and RETURNS the three rows
      # that were waiting on that final wire. The session is now six:
      # CS01 and CS06 check the blueprint locally and need no node;
      # CS02, CS04, CS07 and CS08 execute on the devnet.
      #
      # Five agree with the model by being ACCEPTED. CS04 agrees with
      # it by being REFUSED — a tampered Modify index the cage must
      # reject — so the assertions below bind the VERDICT
      # (agrees-with-model) for every row and never the outcome. This
      # session still carries NO partial and NO held row, so it ends
      # ZERO, and any partial or held report in it is a failure rather
      # than expected debt.
      #
      # CS03 and CS05 stay out and stay unstubbed; they travel with
      # #177/#179.
      #
      # The assertion binds the terminal state this exact session
      # really prints — the devnet leg's own completion line and the
      # runner's exit line — then requires exactly the six CS receipt
      # IDs with no missing or extra receipt, each with its real
      # verdict, on a clean tree, bound to the candidate.
      - name: Run the serialization rows as a packaged app without a dev shell
        working-directory: conformance
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          set +e
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#conformance -- run CS01 CS02 CS04 CS06 CS07 CS08 --receipts-dir "$CONFORMANCE_RECEIPTS" 2>&1 | tee /tmp/serialization-rows.log
          run_rc=${PIPESTATUS[0]}
          set -e
          echo "serialization session exit: $run_rc (expected: exactly 1 — the debt report naming CS04, unmet by ruling)"
          head_sha="$(git rev-parse HEAD)"
          # 1. the EXACT status, never a tolerated range: CS04 has no model
          #    counterpart and is unmet by operator ruling 2026-10-02
          #    (lambdasistemi/singular#347), so the session ends 1 with the
          #    debt report naming exactly CS04; any other exit is an
          #    unexamined build/setup/crash.
          [ "$run_rc" -eq 1 ] || { echo "FAIL: serialization exit $run_rc is not the unmet-debt exit 1"; exit 1; }
          # 2. complete terminal evidence for the session actually run:
          #    the CS devnet leg completes its four devnet rows
          #    (CS02, CS04, CS07, CS08)...
          grep -q 'complete: 4/4 rows ok' /tmp/serialization-rows.log || { echo 'FAIL: the CS devnet leg did not complete its four devnet rows (mid-run failure or crash)'; exit 1; }
          #    ...no partial row, and the debt report naming exactly CS04 as
          #    unmet, nothing held and nothing failing.
          if grep -q 'ROWS PARTIAL' /tmp/serialization-rows.log; then
            echo 'FAIL: a row reported PARTIAL'
            exit 1
          fi
          grep -q 'ROWS THE RUN CANNOT REPORT AS PASSING' /tmp/serialization-rows.log || { echo 'FAIL: the session ended without its debt report'; exit 1; }
          [ "$(sed -n 's/^- Unmet by ruling .*unmet-by-ruling): //p' /tmp/serialization-rows.log)" = "CS04" ] || { echo 'FAIL: the unmet set is not exactly CS04'; exit 1; }
          [ "$(sed -n 's/^- Held .*held-q002): //p' /tmp/serialization-rows.log)" = "none" ] || { echo 'FAIL: a CS row is held'; exit 1; }
          [ "$(sed -n 's/^- Failing .*accepted): //p' /tmp/serialization-rows.log)" = "none" ] || { echo 'FAIL: a CS row is failing'; exit 1; }
          grep -q '^unmet: CS04 UNMET BY RULING: .*lambdasistemi/singular#347' /tmp/serialization-rows.log || { echo 'FAIL: CS04 unmet without its follow-up'; exit 1; }
          # 3. exactly the six CS receipt IDs, no missing and no extra
          printf '%s\n' CS01 CS02 CS04 CS06 CS07 CS08 | sort > /tmp/expected-cs.txt
          nix run --quiet nixpkgs#jq -- -r '.row' "${CONFORMANCE_RECEIPTS}"/receipt-CS*.json | sort > /tmp/receipt-cs.txt
          #    Compared with bash builtins, not diff: this step runs a packaged
          #    app without a dev shell, and an absent diff previously reported
          #    'receipt set mismatch' — an unavailable tool misattributed as a
          #    substantive failure. No external command, so no such path remains.
          if [ "$(</tmp/expected-cs.txt)" != "$(</tmp/receipt-cs.txt)" ]; then
            echo 'FAIL: CS receipt set mismatch (missing or extra row)'
            echo '--- expected ---'; while IFS= read -r l; do echo "$l"; done < /tmp/expected-cs.txt
            echo '--- receipts ---'; while IFS= read -r l; do echo "$l"; done < /tmp/receipt-cs.txt
            exit 1
          fi
          # 4. every row its real verdict — agrees-with-model for the rows
          #    that accept, unmet-by-ruling for CS04 — never partial and
          #    never held, on a clean tree, bound to this candidate
          for row in CS01 CS02 CS04 CS06 CS07 CS08; do
            f="${CONFORMANCE_RECEIPTS}/receipt-$row.json"
            test -f "$f" || { echo "FAIL: missing receipt for $row"; exit 1; }
            want=agrees-with-model
            [ "$row" != CS04 ] || want=unmet-by-ruling
            [ "$(nix run --quiet nixpkgs#jq -- -r '.verdict' "$f")" = "$want" ] || { echo "FAIL: unexpected verdict for $row"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.dirty' "$f")" = "false" ] || { echo "FAIL: $row receipt records a dirty tree"; exit 1; }
            [ "$(nix run --quiet nixpkgs#jq -- -r '.base' "$f")" = "$head_sha" ] || { echo "FAIL: $row not bound to $head_sha"; exit 1; }
          done
          # 5. #287: CS04's refusal carries the traced replay of its transaction.
          bash test/ci/replay-evidence.sh attribution "${CONFORMANCE_RECEIPTS}/receipt-CS04.json" || { echo 'FAIL: CS04 refusal lacks the traced replay'; exit 1; }
          echo 'GREEN = serialization assertion held: CS01 CS02 CS04 CS06 CS07 CS08 executed on a clean candidate-bound tree; CS01 CS02 CS06 CS07 CS08 agree with the model, CS04 is refused by the chain and unmet by ruling (no model counterpart, lambdasistemi/singular#347); no partial and no held row.'
      # Loader and inventory enforcement over the session receipts:
      # the loader validates every receipt (constructor accounting
      # included — a false success or an omitted constructor fails
      # here), and the inventory must render each of this ticket's six
      # serialization rows executed. Neither an arbitrary exit1 nor
      # grep alone is acceptance: the assertions above bind the
      # verdicts. NOTE-058: the state assertion parses the TSV
      # (column 4), never a substring. Non-vacuity is two-sided —
      # CS01, CS02, CS04, CS06, CS07 and CS08 must each appear exactly
      # once and read executed, and no other CS row may render executed
      # or partial, so a missing, duplicated or extra receipt fails
      # here. The quantity is what the assertion is over: the counters
      # are per id so one row rendering twice cannot pay for another
      # rendering not at all.
      - name: Enforce receipt accounting and inventory rendering
        working-directory: conformance
        run: |
          nix run --quiet .#conformance -- list --receipts "$CONFORMANCE_RECEIPTS" 2>&1 | tee /tmp/inventory-render.log
          c1=0 c2=0 c4=0 c6=0 c7=0 c8=0 extra=""
          while IFS= read -r row || [[ -n "$row" ]]; do
            id=${row%%$'\t'*}
            [[ "$id" == CS* ]] || continue
            # Preserve empty TSV fields; whitespace IFS would collapse them.
            for column in 1 2 3; do
              [[ "$row" == *$'\t'* ]] || { echo "FAIL: $id missing state column after field $column"; exit 1; }
              row=${row#*$'\t'}
            done
            state=${row%%$'\t'*}
            case "$id" in
              CS01) c1=$((c1 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS01 state: $state"; exit 1; } ;;
              CS02) c2=$((c2 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS02 state: $state"; exit 1; } ;;
              CS04) c4=$((c4 + 1)); [[ "$state" == unmet-by-ruling ]] || { echo "FAIL: CS04 state: $state"; exit 1; } ;;
              CS06) c6=$((c6 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS06 state: $state"; exit 1; } ;;
              CS07) c7=$((c7 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS07 state: $state"; exit 1; } ;;
              CS08) c8=$((c8 + 1)); [[ "$state" == executed ]] || { echo "FAIL: CS08 state: $state"; exit 1; } ;;
              *) if [[ "$state" == executed || "$state" == partial ]]; then extra="$extra $id"; fi ;;
            esac
          done < /tmp/inventory-render.log
          [[ "$c1" == 1 ]] || { echo "FAIL: CS01 rows: $c1"; exit 1; }
          [[ "$c2" == 1 ]] || { echo "FAIL: CS02 rows: $c2"; exit 1; }
          [[ "$c4" == 1 ]] || { echo "FAIL: CS04 rows: $c4"; exit 1; }
          [[ "$c6" == 1 ]] || { echo "FAIL: CS06 rows: $c6"; exit 1; }
          [[ "$c7" == 1 ]] || { echo "FAIL: CS07 rows: $c7"; exit 1; }
          [[ "$c8" == 1 ]] || { echo "FAIL: CS08 rows: $c8"; exit 1; }
          [[ -z "$extra" ]] || { echo "FAIL: serialization rows outside this ticket's set render as run:$extra"; exit 1; }
          echo 'INVENTORY = CS01/CS02/CS06/CS07/CS08 executed and CS04 unmet-by-ruling (column 4, each exactly once), no other CS row run, loader accepted the accounting.'
      # #287: the extent of every live run above. Each run's replay index
      # must name each refusal its receipts record exactly once; a refusal
      # whose step carried the model's reason is class A, agreeing or
      # uncompared with a named cause; every other refusal is listed by its
      # row in the committed table of
      # specs/287-traced-refusal-reasons/extent.md as B, C or D; each
      # refusing script role has an accepting control; and a run with no
      # refusal fails. The wrong-reason control's run is a deliberate
      # disagreement and is not part of the extent.
      - name: Account for every live refusal against the model
        working-directory: conformance
        run: |
          nix run --quiet .#conformance-extent -- ../specs/287-traced-refusal-reasons/extent.md \
            "$CONFORMANCE_RECEIPTS" \
            "$CONFORMANCE_DEDICATED_RECEIPTS/CG22" \
            "$CONFORMANCE_DEDICATED_RECEIPTS/CG23" \
            "$CONFORMANCE_DEDICATED_RECEIPTS/CG24" \
            "$CONFORMANCE_DEDICATED_RECEIPTS/CG07"
      # CS04, CS07 and CS08 are back in the run list above, re-cut on
      # the final request wire (#183). CS03 and CS05 still travel with
      # #177/#179 and are still not stubbed.
      #
      # STILL RETIRED, still not stubbed: the step "CS07 missing-Fork
      # control fails". It armed a control over the byte-level shape of
      # the PREVIOUS cage wire — a request value the edge wire cannot
      # express — so returning CS07 does not return that control. It is
      # removed outright: no stub, no skip, no echo standing in for it.
      # What CS07 asserts now is the proof shape its own row builds.
      - name: Preserve candidate-bound conformance receipts
        if: always() && (env.CONFORMANCE_RECEIPTS != '' || env.CONFORMANCE_DEDICATED_RECEIPTS != '')
        uses: actions/upload-artifact@v4
        with:
          name: conformance-receipts
          path: |
            ${{ env.CONFORMANCE_RECEIPTS }}
            ${{ env.CONFORMANCE_DEDICATED_RECEIPTS }}
          if-no-files-found: error
      - name: Preserve the dedicated rows' candidate-bound receipts
        if: always() && env.STORY_RECEIPTS != ''
        uses: actions/upload-artifact@v4
        with:
          name: conformance-story-receipts
          path: ${{ env.STORY_RECEIPTS }}
          if-no-files-found: error
  # Issue #80: the theorem-coverage gate. The ratchet (per-obligation,
  # no offsetting) and the full-completion gate (strict, all axes zero) are
  # two distinct results and both run. At the current honest baseline the
  # completion gate REFUSES: mapping, implementation-layer and unclassified
  # debt are nonzero, and an incremental PR must not make it pass. The
  # negated step below asserts exactly that — if the gate ever exits zero
  # here, the record claims completion and this workflow must be flipped
  # deliberately, with the owner's acceptance, not silently.
  coverage-gate:
    name: Theorem coverage gate — inventory, ratchet and completion as distinct results
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Gate test suite incl. every armed failure control (frozen snapshot)
        working-directory: conformance
        run: nix build --quiet --no-link .#coverageGateTests
      - name: Gate verdicts against the frozen snapshot (inventory, ratchet, honest refusal)
        working-directory: conformance
        run: nix build --quiet --no-link .#coverageGateSnapshot
      - name: Inventory — reconcile manifests and discover the obligation population
        run: nix run --quiet ./conformance#coverage-gate -- --root . inventory
      - name: Ratchet — per-obligation regression against the protected base (must pass)
        run: nix run --quiet ./conformance#coverage-gate -- --root . ratchet
      - name: Completion — must refuse while debt is nonzero (flipping this is claiming completion)
        run: |
          if nix run --quiet ./conformance#coverage-gate -- --root . completion; then
            echo "COMPLETION claimed complete; if this is real, flip this step deliberately"
            exit 1
          else
            rc=$?
            test "$rc" -eq 1 || { echo "completion gate failed closed (exit $rc), not INCOMPLETE"; exit 1; }
            echo "COMPLETION: INCOMPLETE — the honest nonzero baseline, reported as its own result"
          fi
