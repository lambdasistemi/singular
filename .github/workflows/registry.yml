  demo1-refusals:
    name: Demo 1 ordinary CLI refusal controls
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #299: the registry refuses an insertion the application books for a
      # key that is Active or already Terminal. The ordinary `insert` stops
      # partial naming its pending request; that request's fold, submitted
      # without local evaluation, is refused by the state validator; each
      # refusal sits beside an accepting control; every verdict is computed
      # from the run's receipts, on the job's own development node.
      #
      # #419: the run's exit is trusted only after it judged at least one
      # clause; the clause summary and every clause that does not hold or is
      # uncovered are printed, and the verdict section and receipts are
      # uploaded whatever the outcome.
      - name: Run the ordinary CLI's refusal controls
        run: |
          printf 'DEMO1_CONTROLS_RESULTS=%s\n' "$RUNNER_TEMP/demo1-controls-results" >> "$GITHUB_ENV"
          DEMO1_CONTROLS_RESULTS="$RUNNER_TEMP/demo1-controls-results" nix run --quiet .#demo1-cli-controls
      - name: Preserve the refusal controls' verdicts and receipts
        if: always() && env.DEMO1_CONTROLS_RESULTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: demo1-refusal-controls
          path: ${{ env.DEMO1_CONTROLS_RESULTS }}
          if-no-files-found: error
