# Registry cross-tree gates (A-002, D-005).
#
# This workflow enforces the two cross-tree relationships that neither
# isolated flake can see (the trees are two self-contained flakes since
# the two-flake split; a green `nix flake check` on either asserts
# nothing about vector freshness, and nothing builds the blueprint
# before the Haskell side consumes it):
#
#   1. the real vector comparison — the Haskell generator's output,
#      formatted by the pinned Aiken, diffed against the committed
#      golden `onchain/validators/cage_vectors.ak` (D-003/D-006);
#   2. an explicit order — the Aiken blueprint build is a job of its
#      own and the devnet end-to-end job runs only after it (`needs:`): if the
#      blueprint cannot build, the expensive devnet job is skipped
#      instead of failing later for the same reason. Freshness itself is
#      NOT carried by the ordering edge: the e2e recipe builds
#      ../onchain#plutus-blueprint itself and points REGISTRY_BLUEPRINT at
#      that exact store path, so what the suite consumes is always the
#      artifact built from the checked-out commit. `needs:` is the
#      ordering and fail-fast; the recipe is the freshness guarantee.
#
# Every command below was executed on the worker host before this file
# was written, with receipts (t31-recipes-ci handoffs/recipes-ci-report.md):
#   - nix build --quiet --no-link --print-out-paths .#plutus-blueprint  (exit 0)
#   - nix develop --quiet --command just vectors-check                  (exit 0, PASS)
#   - nix develop --quiet --command just haskell-e2e                    (exit 0, 6/6)
name: Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'onchain/**'
      - 'naming-onchain/**'
      - 'offchain/**'
      # The drift check also watches epic 15's live corpus.
      - 'lean/**'
      - '.github/workflows/registry.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blueprint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  naming-validators:
    name: Naming validators build, refuse, and match their pinned identity
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #52: Singular's own naming validators (naming-onchain/,
      # a separate Aiken tree whose flake.lock is a byte-for-byte copy
      # of onchain's — the two-flake split pattern of D-018). One
      # command runs the whole slice gate: `nix flake check` builds
      # checks.aiken-check (the hermetic Aiken suite — every enforced
      # condition paired with a refusal, fixtures taken from the
      # accepted v0.2.0 corpus rows LM01..LM04/LC01..LC06) and
      # checks.script-identity (the compiled blueprint compared
      # two-directionally against the committed script-identity.json,
      # quantified over the validator set, with parameter counts — the
      # onchain #34 pattern). The copied lock pins the same nixpkgs as
      # the imported partition, so the Aiken compiler — and therefore
      # every pinned hash — is directly comparable with onchain's.
      - name: Run the naming validator suite and identity check
        working-directory: naming-onchain
        run: nix flake check
      - name: Check compiled maintenance value refusals
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../naming-onchain#plutus-blueprint)"
          NAMING_BLUEPRINT="$blueprint" nix run --quiet .#record-value-tests
  blueprint:
    name: Aiken blueprint builds first
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Aiken blueprint
        working-directory: onchain
        run: nix build --quiet --no-link --print-out-paths .#plutus-blueprint
  script-identity:
    name: Compiled script identity matches the manifest
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #34: the compiled script hash IS the contract's identity.
      # Rebuild the blueprint and compare every validator against the
      # committed manifest onchain/script-identity.json — a moved hash, a
      # validator missing from the manifest, a manifest entry with no
      # counterpart in the build, or a moved compiler string fails the
      # job. A deliberate identity change regenerates the manifest via
      # `just script-identity-regen`, and the manifest diff is what the
      # reviewer reads. Same derivation as checks.script-identity, so a
      # local `nix flake check` in onchain/ runs the identical comparison.
      - name: Compare the committed manifest with a fresh blueprint build
        working-directory: onchain
        run: nix build --quiet --no-link --print-out-paths .#script-identity
  aiken-suite:
    name: Onchain Aiken unit and property suite passes
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #79 (NOTE-005/NOTE-006): the onchain Aiken suite is an
      # enforced check, not documentation. Four of its tests asserted
      # the removed owner gate on `Modify` (`modify_missing_signature`,
      # `modify_with_stake_script_no_withdrawal`,
      # `prop_modify_requires_owner`, `reject_missing_signature`) with
      # nothing executing them — a suite nobody runs cannot catch the
      # next person who "fixes" those tests by reverting the repair.
      # The tests are re-cut to what Lean mandates (permissionless
      # `Modify`, owner obligation on `End` only), and this job runs
      # the whole suite (`nix flake check` in onchain/: the Aiken unit
      # and property tests plus the blueprint and identity checks) with
      # the pinned toolchain from that flake's own lock — no dev shell,
      # no ambient state. A red test fails the job (markers:
      # aiken-suite-green, aiken-suite-pinned-toolchain). It covers the
      # validator unit/property surface only — ledger behavior stays
      # with the devnet row runners.
      - name: Run the onchain Aiken suite as a flake check
        working-directory: onchain
        run: nix flake check
  vectors-fresh:
    name: Cage vectors match the generator
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Read-only verification (D-006): generate into a temp path, format
      # that with the pinned Aiken (nix develop ../onchain#aiken), diff
      # against the committed golden. The recipe writes nothing in either
      # tree; only `just generate-vectors` writes the golden.
      - name: Diff generator output against the committed golden
        run: nix run --quiet .#vectors-check
  naming-wire:
    name: Naming wire vectors match the epic-15 contract
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #45: the naming datum codec must agree with the epic-15
      # v0.2.0 contract's own bytes. The four wire vectors are vendored
      # with provenance in offchain/naming/src/Naming/Wire/Vectors.hs
      # (the codec moved inside the offchain flake root in issue #51),
      # so the job needs no network. The suite is pure base + bytestring
      # and is compiled and run with the dev-shell GHC directly: no
      # cabal, no package index, no warm state (the same D-011 reasoning
      # as the hermetic e2e, at unit-test cost).
      - name: Run the naming wire vector suite
        run: nix run --quiet .#naming-wire-suite
  vector-drift:
    name: Vendored v0.2.0 vectors match the live corpus
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #49: the four wire vectors are pinned twice by design (D-016)
      # — vendored into offchain/naming/src/Naming/Wire/Vectors.hs with
      # their provenance, and live in epic 15's merged corpus at
      # lean/lifecycle-corpus.json. If epic 15 revises its corpus, nothing
      # said so — until now. The check compares every value the vendored
      # module pins (five wire byte arrays, WD01's fixture and shape,
      # WD02's attachment hash, WD03's encoded datum, WR01's proposal,
      # shape, comparison result and refund addresses) against the
      # corresponding field of the corpus row with the same id, and fails
      # on divergence. Divergence is surfaced, never resolved: the vendored
      # bytes stay pinned to v0.2.0 and a human decides whether to adopt
      # the new contract (markers: vector-drift-check,
      # drift-pinned-release, drift-live-corpus). The check is pure base +
      # bytestring compiled with the dev-shell GHC (the run-suite.sh
      # pattern) — no cabal, no package index, no network. The lean/**
      # paths filter above is what makes this job fire when epic 15
      # revises the corpus.
      - name: Compare the vendored wire vectors with the live corpus
        run: nix run --quiet .#naming-drift-check
  # D6 (issue #157): the Naming Your Assets application journeys are retired from this
  # workflow's required set. Six job blocks stood here and ran seven
  # journey surfaces — `li01`, `li-refusals`, `lmlc` (the `naming-rows`
  # job), `recovery`, `retirement` together with its retained
  # `retire-verify` exhibit, and `repair`. Every one of them consumes the
  # naming application rather than the registry, so their application-level
  # re-cut is issue #172 under the Naming Your Assets epic #174, once #154 closes.
  # Retired means the job blocks are gone: none is stubbed green, turned
  # into a conditional skip, or given any other substitute success path
  # here. The registry-protocol jobs (`e2e`, `journey`) and the generic
  # rows above are unaffected.
  # #449: the devnet E2E modules each start their own development node, so
  # they run as parallel parts, one per lane (Test.Tags.Lane), listed once in
  # .github/ci/e2e-parts.json. The plan proves the selection before any node
  # starts: every lane selects at least one example, the lanes add up to the
  # whole suite, and no example is outside every lane.
  e2e-plan:
    name: Devnet E2E lanes select the whole suite
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 30
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Prove the lanes select the whole suite (dry runs, no node)
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet ..#e2e-lanes-proof -- ../.github/ci/e2e-parts.json
      - id: parts
        name: Publish the parts
        run: |
          printf 'parts=%s\n' "$(nix run --quiet nixpkgs#jq -- -c . .github/ci/e2e-parts.json)" >> "$GITHUB_OUTPUT"
  e2e-part:
    name: "Devnet E2E part: ${{ matrix.part.name }}"
    needs: e2e-plan
    runs-on: nixos
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.e2e-plan.outputs.parts) }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run this part of the devnet E2E against a fresh blueprint
        working-directory: offchain
        env:
          LANE: ${{ matrix.part.lane }}
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # A lane that runs no example fails.
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#cage-tests-e2e -- --match "{lane:$LANE}" --fail-on=empty
  # The required check keeps its name and fails unless every part passed: a
  # skipped job would otherwise count as passing.
  e2e:
    name: Devnet E2E on the fresh blueprint
    needs: [e2e-plan, e2e-part]
    if: always()
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Every E2E part passed
        env:
          PLAN: ${{ needs.e2e-plan.result }}
          PARTS: ${{ needs.e2e-part.result }}
        run: |
          echo "E2E plan: $PLAN, parts: $PARTS"
          [ "$PLAN" = success ] && [ "$PARTS" = success ]
  contract:
    name: Backend contract suite on every adapter
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #326 R1/R2/R3: one case list over every adapter — in-memory, the
      # indexer over the in-memory node, and the node and indexer adapters on
      # devnet nodes the suite generates — each run named with its evidence
      # class, each case an adapter cannot exercise reported for it by name.
      # The generated-node rows also hold the session's connection guard: a
      # node call from inside a view fails by name instead of hanging.
      # #326 R9: every case's result on every adapter is also written as one
      # JSON line (adapter, evidence class, case, outcome and reason, the
      # checked-out revision and whether the tree was clean) and kept as the
      # contract-results artifact; the published evidence page is computed
      # from a committed copy of it.
      - name: Run the contract suite (in-memory, generated DevNet)
        working-directory: offchain
        run: |
          CONTRACT_RESULTS_DIR="$(mktemp -d "$RUNNER_TEMP/contract-results.XXXXXX")"
          printf 'CONTRACT_RESULTS_DIR=%s\n' "$CONTRACT_RESULTS_DIR" >> "$GITHUB_ENV"
          CONTRACT_RESULTS="$CONTRACT_RESULTS_DIR/generated.jsonl" nix run --quiet .#contract-tests
      # #326 R4: a SignedTx is constructible only through signTx; the check
      # also compiles both forgeries against a copy of the module exporting
      # the constructor, so it can fail.
      - name: SignedTx is constructible only by signing
        working-directory: offchain
        run: nix build --quiet --no-link .#signed-tx-control
      # #326 R5: a devnet started as a separate process; the suite reaches it
      # only by socket path, network magic and a funded key file.
      - name: Run the contract suite against an externally started DevNet
        working-directory: offchain
        run: CONTRACT_RESULTS="$CONTRACT_RESULTS_DIR/external.jsonl" nix run --quiet .#contract-external
      - name: Preserve candidate-bound contract results
        if: always() && env.CONTRACT_RESULTS_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: contract-results
          path: ${{ env.CONTRACT_RESULTS_DIR }}
          if-no-files-found: error
  journey:
    name: The bounded registry journey, narrated end to end
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #37: the epic's runnable artifact. One command boots a
      # cage, submits a request, applies it and reads the resulting
      # state back on a real devnet, printing one line per step plus
      # the pinned unapplied script identities (read from
      # onchain/script-identity.json) and the applied hashes this run
      # derived from them and carried on chain — the
      # derived-applied-identity assertion fails the job when the
      # derivation does not reproduce an applied hash. It is the
      # same library code
      # path as the e2e suite — no mocks, no stubbed node — and it is
      # hermetic (D-011): the Nix-built binary brings the locked
      # cardano-node on its own PATH; no cabal, no package index, no
      # warm developer state. It covers the cage protocol surface
      # only — it does not demonstrate Singular naming-claim or
      # maintenance behaviour.
      - name: Run the bounded registry journey against a real devnet
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#journey
      # #173 A173-COMMAND (NOTE-014 ruling): the day-0 artifact rule made
      # concrete. A documented command that does not exist in CI is the
      # same defect as an unrun check, so the release archive the
      # publishing pipeline builds is built HERE, extracted OUTSIDE the
      # checkout, and its documented `insert-active` invocation is run
      # against this job's devnet with no checkout and no naming
      # blueprint in sight. The step asserts exit 0 and the active token
      # at the wallet the command named.
      #
      # Falsification: on any ancestor where the verb is absent from the
      # archive this step fails at the invocation itself — that is the
      # RED this row was frozen with, and it is the reason the step
      # extracts rather than running the verb from the worktree.
      - name: Run insert-active from the extracted release archive
        run: |
          set -e
          release_dir="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          nix run --quiet .#release-artifacts -- "$release_dir"
          version="$(cat version.txt)"
          # Extracted OUTSIDE the checkout: a reviewer with the archive
          # and nothing else must reach the same place.
          extracted="$(mktemp -d "$RUNNER_TEMP/extracted.XXXXXX")"
          tar -C "$extracted" -xzf "$release_dir/singular-onchain-$version.tar.gz"
          test ! -e "$extracted/.git" || { echo 'FAIL: the archive carries a git checkout'; exit 1; }
          # The archive's own run page is the authority for the command;
          # the step runs exactly what the page documents.
          test -f "$extracted/INSERT-ACTIVE.md" || { echo 'FAIL: the archive carries no insert-active run page'; exit 1; }
          observed="$(mktemp "$RUNNER_TEMP/insert-active.XXXXXX.json")"
          (
            cd "$extracted/offchain"
            REGISTRY_BLUEPRINT="$extracted/onchain/plutus.json" \
              nix run --quiet .#insert-active -- --observed "$observed"
          )
          # The observation, not the exit code: exactly one active token,
          # at the key the command inserted, in the output at the wallet
          # the command named.
          #
          # The duplicate is asserted by its OUTCOME and its accepting
          # control, not by a trace name. The ledger's EvalFailure carries
          # an EMPTY Plutus log list, so the cage's `key-exists` trace is
          # not recoverable from it and the command emits null rather than
          # a guess. The NAME is asserted at the Aiken layer, through
          # `lib.occupiedRefusal`, the construction site the validator
          # reads. Asserting it here would be asserting a literal the
          # command wrote to make this step pass.
          nix run --quiet nixpkgs#jq -- -e '
            .edge == "insertActive"
            and (.fold.txid | test("^[0-9a-f]{64}$"))
            and .wallet.address == .requested.address
            and .wallet.assets == [{"policy": .active.policy, "name": .key, "quantity": 1}]
            and ."key-exists".outcome == "refused"
            and (."key-exists".control.outcome == "accepted")
            and (."key-exists".detail | type == "string" and length > 0)
          ' "$observed" > /dev/null || { echo 'FAIL: insert-active did not observe one active token at the named wallet'; exit 1; }
          echo "ARCHIVE = insert-active ran from $extracted with no checkout and observed the active token at the named wallet."
      # #177 A-002 row S03, CI change in this ticket: the focused
      # off-chain suite carries the retirement's holder-selection,
      # wrong-key and no-sweep controls. They are pure decisions of
      # `registryDuties` — the one place the off-chain side decides what
      # an edge owes — so they belong on the cheap job beside the
      # devnet one, not inside it.
      #
      # Falsification: on any ancestor where `registryDuties` returns
      # `mempty` for edge 3, the burn-without-source row fails here.
      - name: Run the focused off-chain suite
        working-directory: offchain
        run: nix run --quiet .#cage-tests
      # #177 I177-COMMAND (A-002 ruling), the sibling of the
      # insert-active step above: the release archive is built HERE,
      # extracted OUTSIDE the checkout, and its documented
      # `update-terminal` invocation is run against this job's devnet
      # with no checkout in sight. The step asserts the OBSERVATION, not
      # the exit code.
      #
      # Falsification: on any ancestor where the verb or its page is
      # absent from the archive this step fails at the required page or
      # at the invocation itself.
      - name: Run update-terminal from the extracted release archive
        run: |
          set -e
          release_dir="$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")"
          nix run --quiet .#release-artifacts -- "$release_dir"
          version="$(cat version.txt)"
          extracted="$(mktemp -d "$RUNNER_TEMP/extracted.XXXXXX")"
          tar -C "$extracted" -xzf "$release_dir/singular-onchain-$version.tar.gz"
          test ! -e "$extracted/.git" || { echo 'FAIL: the archive carries a git checkout'; exit 1; }
          test -f "$extracted/UPDATE-TERMINAL.md" || { echo 'FAIL: the archive carries no update-terminal run page'; exit 1; }
          observed="$(mktemp "$RUNNER_TEMP/update-terminal.XXXXXX.json")"
          (
            cd "$extracted/offchain"
            REGISTRY_BLUEPRINT="$extracted/onchain/plutus.json" \
              nix run --quiet .#update-terminal -- --observed "$observed"
          )
          # The observation, not the exit code: the active quantity goes
          # 1 -> 0, the exact keyed `-1` mint is burned from a
          # token-bearing source input, the three roots are distinct and
          # the committed leaf reads Terminal. The two refusals are
          # asserted by OUTCOME and by their accepting controls; a trace
          # name is accepted only when the ledger actually surfaced it,
          # because an EvalFailure carries an empty Plutus log list and
          # the exact names are enforced at the Aiken layer.
          # The jq program below is single-quoted ON PURPOSE: every `$`
          # in it is a JQ variable, not a shell one, and the body is
          # byte-identical to the frozen gate.sh. shellcheck cannot tell
          # the two languages apart.
          # shellcheck disable=SC2016
          nix run --quiet nixpkgs#jq -- -e '
            def txid: type == "string" and test("^[0-9a-f]{64}$");
            def text: type == "string" and length > 0;
            .edge == "updateTerminal"
            and (.retirement != null)
            and (.retirement as $r |
              ($r.activePolicy | text) and ($r.key | text)
              and ($r.insertTxid | txid) and ($r.retireTxid | txid)
              and $r.insertTxid != $r.retireTxid
              and ([$r.roots.beforeInsert, $r.roots.active, $r.roots.terminal]
                | all(.[]; text) and (unique | length == 3))
              and $r.quantities == {"before": 1, "after": 0}
              and $r.mint == [{"policy": $r.activePolicy, "name": $r.key, "quantity": -1}]
              and ($r.source.outref | text)
              and $r.source.policy == $r.activePolicy
              and $r.source.name == $r.key
              and $r.source.quantity == 1
              and $r.leaf == "Terminal"
              and ($r.unknown.detail | text)
              and ($r.unknown.trace == null or $r.unknown.trace == "key-unknown")
              and ($r.unknown.controlTxid | txid)
              and ($r.absent.detail | text)
              and ($r.absent.trace == null or $r.absent.trace == "not-booked")
              and ($r.absent.controlTxid | txid)
            )
          ' "$observed" > /dev/null || { echo 'FAIL: update-terminal observation moved'; exit 1; }
          echo "ARCHIVE = update-terminal ran from $extracted with no checkout and observed the keyed burn and the Terminal leaf."
  demo1-archive:
    name: Demo 1 journey from the release archive
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #299: the release archive is built and, #326, verified by
      # verify-release exactly as a published release is, the assembled
      # assets presented as its download input: sums, the stated model
      # revision, members, then the archive extracted OUTSIDE the checkout
      # and its DEMO1.md journey run as separate `singular` processes —
      # create, insert, inspect, update, inspect, terminate, inspect —
      # against ONE development node, asserting the receipts' identity
      # continuity and ledger reads and every refusal control at its
      # boundary; the retained insert-active and update-terminal archive
      # controls run from the same extraction.
      #
      # Falsification: on any ancestor without the command or its page
      # this step fails at the page check or at the first invocation.
      - name: Run the Demo 1 singular journey from the extracted release archive
        run: nix run --quiet .#demo1-cli-check
