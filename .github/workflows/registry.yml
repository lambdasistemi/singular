# Registry cross-tree gates (A-002, D-005).
#
# This workflow enforces the two cross-tree relationships that neither
# isolated flake can see (the trees are two self-contained flakes since
# the two-flake split; a green `nix flake check` on either asserts
# nothing about vector freshness, and nothing builds the blueprint
# before the Haskell side consumes it):
#
#   1. the real vector comparison — the Haskell generator's output,
#      formatted by the pinned Aiken, diffed against the committed
#      golden `onchain/validators/cage_vectors.ak` (D-003/D-006);
#   2. an explicit order — the Aiken blueprint build is a job of its
#      own and the devnet end-to-end job runs only after it (`needs:`): if the
#      blueprint cannot build, the expensive devnet job is skipped
#      instead of failing later for the same reason. Freshness itself is
#      NOT carried by the ordering edge: the e2e recipe builds
#      ../onchain#plutus-blueprint itself and points REGISTRY_BLUEPRINT at
#      that exact store path, so what the suite consumes is always the
#      artifact built from the checked-out commit. `needs:` is the
#      ordering and fail-fast; the recipe is the freshness guarantee.
#
# Every command below was executed on the worker host before this file
# was written, with receipts (t31-recipes-ci handoffs/recipes-ci-report.md):
#   - nix build --quiet --no-link --print-out-paths .#plutus-blueprint  (exit 0)
#   - nix develop --quiet --command just vectors-check                  (exit 0, PASS)
#   - nix develop --quiet --command just haskell-e2e                    (exit 0, 6/6)
name: Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'onchain/**'
      - 'naming-onchain/**'
      - 'offchain/**'
      - 'applications/**'
      # The drift check also watches epic 15's live corpus.
      - 'lean/**'
      - '.github/workflows/registry.yml'
  pull_request:
    branches: [main, 'epic/**']
permissions:
  contents: read
concurrency:
  group: blueprint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  naming-validators:
    name: Naming validators build, refuse, and match their pinned identity
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #52: Singular's own naming validators (naming-onchain/,
      # a separate Aiken tree whose flake.lock is a byte-for-byte copy
      # of onchain's — the two-flake split pattern of D-018). One
      # command runs the whole slice gate: `nix flake check` builds
      # checks.aiken-check (the hermetic Aiken suite — every enforced
      # condition paired with a refusal, fixtures taken from the
      # accepted v0.2.0 corpus rows LM01..LM04/LC01..LC06) and
      # checks.script-identity (the compiled blueprint compared
      # two-directionally against the committed script-identity.json,
      # quantified over the validator set, with parameter counts — the
      # onchain #34 pattern). The copied lock pins the same nixpkgs as
      # the imported partition, so the Aiken compiler — and therefore
      # every pinned hash — is directly comparable with onchain's.
      - name: Run the naming validator suite and identity check
        working-directory: naming-onchain
        run: nix flake check
  blueprint:
    name: Aiken blueprint builds first
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the Aiken blueprint
        working-directory: onchain
        run: nix build --quiet --no-link --print-out-paths .#plutus-blueprint
  script-identity:
    name: Compiled script identity matches the manifest
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #34: the compiled script hash IS the contract's identity.
      # Rebuild the blueprint and compare every validator against the
      # committed manifest onchain/script-identity.json — a moved hash, a
      # validator missing from the manifest, a manifest entry with no
      # counterpart in the build, or a moved compiler string fails the
      # job. A deliberate identity change regenerates the manifest via
      # `just script-identity-regen`, and the manifest diff is what the
      # reviewer reads. Same derivation as checks.script-identity, so a
      # local `nix flake check` in onchain/ runs the identical comparison.
      - name: Compare the committed manifest with a fresh blueprint build
        working-directory: onchain
        run: nix build --quiet --no-link --print-out-paths .#script-identity
      # #528 S5.1: the split-blueprint hash comparison. The open-datum
      # validators build in their own Aiken project now, so no single
      # blueprint holds the whole contract: this step rebuilds the registry
      # blueprint and the application blueprint and requires their union to
      # equal the base set byte-identically, with its changed-hash and
      # missing-validator plants refused on every run. Same app as
      # `nix run .#script-hash-comparison` at the repository root.
      - name: Compare the split blueprints against the base hash set
        run: nix run --quiet .#script-hash-comparison
  aiken-suite:
    name: Onchain Aiken unit and property suite passes
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Issue #79 (NOTE-005/NOTE-006): the onchain Aiken suite is an
      # enforced check, not documentation. Four of its tests asserted
      # the removed owner gate on `Modify` (`modify_missing_signature`,
      # `modify_with_stake_script_no_withdrawal`,
      # `prop_modify_requires_owner`, `reject_missing_signature`) with
      # nothing executing them — a suite nobody runs cannot catch the
      # next person who "fixes" those tests by reverting the repair.
      # The tests are re-cut to what Lean mandates (permissionless
      # `Modify`, owner obligation on `End` only), and this job runs
      # the whole suite (`nix flake check` in onchain/: the Aiken unit
      # and property tests plus the blueprint and identity checks) with
      # the pinned toolchain from that flake's own lock — no dev shell,
      # no ambient state. A red test fails the job (markers:
      # aiken-suite-green, aiken-suite-pinned-toolchain). It covers the
      # validator unit/property surface only — ledger behavior stays
      # with the devnet row runners.
      - name: Run the onchain Aiken suite as a flake check
        working-directory: onchain
        run: nix flake check
  application-blueprint:
    name: Application blueprint builds first
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #528 S5.3: the application's own blueprint obligations, from its
      # own flake with its own lock (same toolchain as the registry's).
      # Builds the application validators' blueprint and the merged
      # deployment document; same derivations a local
      # `nix build .#plutus-blueprint` / `.#open-datum-blueprint` in
      # applications/open-datum/onchain/ verify.
      - name: Build the application blueprint
        working-directory: applications/open-datum/onchain
        run: nix build --quiet --no-link --print-out-paths .#plutus-blueprint
      - name: Build the merged deployment blueprint
        working-directory: applications/open-datum/onchain
        run: nix build --quiet --no-link --print-out-paths .#open-datum-blueprint
  application-script-identity:
    name: Application script identity matches the manifest
    needs: application-blueprint
    runs-on: nixos
    timeout-minutes: 15
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #528 S5.3: the application's compiled script hash IS its
      # contract's identity, as the registry's is. Rebuilds the
      # application blueprint and compares every validator against the
      # committed applications/open-datum/onchain/script-identity.json,
      # then regenerates the application permanent record and module from
      # the same blueprint alone. Same derivation as
      # checks.script-identity in the application's flake.
      - name: Compare the committed application manifest with a fresh build
        working-directory: applications/open-datum/onchain
        run: nix build --quiet --no-link --print-out-paths .#script-identity
  application-aiken-suite:
    name: Application Aiken unit and property suite passes
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #528 S5.3: the application's Aiken suite as its own hosted job
      # (counterpart of the registry aiken-suite): formatter, identity,
      # composed assembly and full boundary over the merged blueprint,
      # with the pinned toolchain from the application's own lock.
      - name: Run the application Aiken suite as a flake check
        working-directory: applications/open-datum/onchain
        run: nix flake check
  vectors-fresh:
    name: Cage vectors match the generator
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Read-only verification (D-006): generate into a temp path, format
      # that with the pinned Aiken (nix develop ../onchain#aiken), diff
      # against the committed golden. The recipe writes nothing in either
      # tree; only `just generate-vectors` writes the golden.
      - name: Diff generator output against the committed golden
        run: nix run --quiet .#vectors-check
  # D6 (issue #157): the Naming Your Assets application journeys are retired from this
  # workflow's required set. Six job blocks stood here and ran seven
  # journey surfaces — `li01`, `li-refusals`, `lmlc` (the `naming-rows`
  # job), `recovery`, `retirement` together with its retained
  # `retire-verify` exhibit, and `repair`. Every one of them consumes the
  # naming application rather than the registry, so their application-level
  # re-cut is issue #172 under the Naming Your Assets epic #174, once #154 closes.
  # Retired means the job blocks are gone: none is stubbed green, turned
  # into a conditional skip, or given any other substitute success path
  # here. The registry-protocol jobs (`e2e`, `journey`) and the generic
  # rows above are unaffected.
  # #449: the devnet E2E modules each start their own development node, so
  # they run as parallel parts, one per lane (Test.Tags.Lane), listed once in
  # .github/ci/e2e-parts.json. The plan proves the selection before any node
  # starts: every lane selects at least one example, the lanes add up to the
  # whole suite, and no example is outside every lane.
  e2e-plan:
    name: Devnet E2E lanes select the whole suite
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 30
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Prove the lanes select the whole suite (dry runs, no node)
        working-directory: offchain
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet ..#e2e-lanes-proof -- ../.github/ci/e2e-parts.json
      - id: parts
        name: Publish the parts
        run: |
          printf 'parts=%s\n' "$(nix run --quiet nixpkgs#jq -- -c . .github/ci/e2e-parts.json)" >> "$GITHUB_OUTPUT"
  e2e-part:
    name: "Devnet E2E part: ${{ matrix.part.name }}"
    needs: e2e-plan
    runs-on: nixos
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.e2e-plan.outputs.parts) }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run this part of the devnet E2E against a fresh blueprint
        working-directory: offchain
        env:
          LANE: ${{ matrix.part.lane }}
        run: |
          blueprint="$(nix build --quiet --no-link --print-out-paths ../onchain#plutus-blueprint)"
          # A lane that runs no example fails.
          REGISTRY_BLUEPRINT="$blueprint" nix run --quiet .#cage-tests-e2e -- --match "{lane:$LANE}" --fail-on=empty
  # The required check keeps its name and fails unless every part passed: a
  # skipped job would otherwise count as passing.
  e2e:
    name: Devnet E2E on the fresh blueprint
    needs: [e2e-plan, e2e-part]
    if: ${{ !cancelled() }}
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Every E2E part passed
        env:
          PLAN: ${{ needs.e2e-plan.result }}
          PARTS: ${{ needs.e2e-part.result }}
        run: |
          echo "E2E plan: $PLAN, parts: $PARTS"
          [ "$PLAN" = success ] && [ "$PARTS" = success ]
  contract:
    name: Backend contract suite on every adapter
    runs-on: nixos
    timeout-minutes: 60
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #326 R1/R2/R3, retired under #383: one case list over the generic
      # provider harness — the eleven original node/indexer requirements keep
      # their exact wording but are published as unsupported where the retired
      # adapters' promises do not hold, never passed under weaker session
      # semantics; separate cases exercise the generic provider. Each run names
      # its evidence class: test-adapter (synthetic) or devnet (private);
      # neither names a public-chain acceptance.
      # #326 R9: every case's result on every adapter is also written as one
      # JSON line (adapter, evidence class, case, outcome and reason, the
      # checked-out revision and whether the tree was clean) and kept as the
      # contract-results artifact; the published evidence page is computed
      # from a committed copy of it.
      - name: Run the contract suite (in-memory, generated DevNet)
        working-directory: offchain
        run: |
          CONTRACT_RESULTS_DIR="$(mktemp -d "$RUNNER_TEMP/contract-results.XXXXXX")"
          printf 'CONTRACT_RESULTS_DIR=%s\n' "$CONTRACT_RESULTS_DIR" >> "$GITHUB_ENV"
          CONTRACT_RESULTS="$CONTRACT_RESULTS_DIR/generated.jsonl" nix run --quiet .#contract-tests
      # #326 R4: a SignedTx is constructible only through signTx; the check
      # also compiles both forgeries against a copy of the module exporting
      # the constructor, so it can fail.
      - name: SignedTx is constructible only by signing
        working-directory: offchain
        run: nix build --quiet --no-link .#signed-tx-control
      # #326 R5: a devnet started as a separate process; the suite reaches it
      # only by socket path, network magic and a funded key file.
      - name: Run the contract suite against an externally started DevNet
        working-directory: offchain
        run: CONTRACT_RESULTS="$CONTRACT_RESULTS_DIR/external.jsonl" nix run --quiet .#contract-external
      - name: Preserve candidate-bound contract results
        if: always() && env.CONTRACT_RESULTS_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: contract-results
          path: ${{ env.CONTRACT_RESULTS_DIR }}
          if-no-files-found: error
  cage-tests:
    name: Off-chain registry and command tests
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run the off-chain suite
        working-directory: offchain
        run: nix run --quiet .#cage-tests
  cli-recovery-partitions:
    name: CLI recovery — discover the hosted partitions
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 15
    outputs:
      partitions: ${{ steps.partitions.outputs.partitions }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Holding updates, termination bookings and public termination folds each
      # have their own partition in the root flake. The discovered matrix runs
      # every one through the same journal and no-resubmission predicates.
      # The hosted recovery partitions live in one place in the root flake.
      # This step prints them (no node) for the matrix below and judges the
      # census: every retained scenario part in exactly one partition,
      # with nonempty discovery and no retired command dependencies.
      - name: Discover the hosted partitions and check the census
        id: partitions
        run: |
          nix run --quiet .#cli-recovery-partitions > "$RUNNER_TEMP/partitions.json"
          cat "$RUNNER_TEMP/partitions.json"
          nix run --quiet .#cli-recovery-partition-check -- "$PWD" "$RUNNER_TEMP/partitions.json"
          printf 'partitions=%s\n' "$(cat "$RUNNER_TEMP/partitions.json")" >> "$GITHUB_OUTPUT"
      # #451: the specification this part delivers stays presentable —
      # stories, diagrams, no index labels, speech stamps.
      - name: Check the cross-wallet specification's presentation
        run: nix develop --quiet --no-write-lock-file -c python3 tools/check_presentation.py --front specs/451-cross-wallet-fold/spec.md specs/451-cross-wallet-fold
  cli-recovery-partition:
    name: "CLI recovery — ${{ matrix.partition.key }}: ${{ matrix.partition.parts }}"
    needs: [blueprint, cli-recovery-partitions]
    runs-on: nixos
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(needs.cli-recovery-partitions.outputs.partitions).partition }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Every retained partition runs on its own fresh node. Its commands
      # are interrupted with lost answers, kills and unsent transactions;
      # the journal and signed-body checks judge recovery without resubmission.
      - name: Run the partition's parts
        run: DEMO1_KEEP_SCRATCH=1 nix run --quiet .#cli-recovery-partition -- '${{ matrix.partition.key }}'
      # Collect through the packaged collector app — explicit runtime tools,
      # no ambient runner PATH — then always retain the bundle. Producer
      # identity is this candidate, run and partition; derived mutation
      # copies, snapshots, funding keys and the node database stay out by
      # measured extent; an expected record an early failure never produced
      # is named absent, never fabricated; an upload failure fails this
      # delivery check.
      - name: Collect the partition's recorded evidence
        if: always()
        env:
          RECOVERY_PARTITION: ${{ matrix.partition.key }}
        run: |
          run_dir=""
          for candidate_dir in "$RUNNER_TEMP"/cli-recovery.*/run; do
            if [ -d "$candidate_dir" ]; then run_dir="$candidate_dir"; fi
          done
          run_dir="${run_dir:-$RUNNER_TEMP/no-recovery-run}"
          nix run --quiet .#cli-recovery-cross-wallet-evidence -- \
            "$run_dir" "$RUNNER_TEMP/recovery-evidence" \
            '${{ github.event.pull_request.head.sha || github.sha }}' '${{ github.run_id }}' "$RECOVERY_PARTITION"
          safe="${RECOVERY_PARTITION//:/-}"
          safe="${safe// /-}"
          echo "ARTIFACT_NAME=cli-recovery-${{ github.event.pull_request.head.sha || github.sha }}-run${{ github.run_id }}-$safe" >> "$GITHUB_ENV"
          # The partition kept its scratch so this step could copy it. A reused
          # runner would otherwise retain the node database.
          rm -rf "$RUNNER_TEMP"/cli-recovery.*
      # Every retained run uses both wallets; verify their original journals,
      # signed bodies and producer-bound manifest before retaining the bundle.
      - name: Verify the collected evidence bundle
        if: always()
        run: bash tools/cli_recovery_evidence_check.sh "${{ runner.temp }}/recovery-evidence"
      - name: Retain the partition's recorded evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/recovery-evidence
          if-no-files-found: error
  facade-lifecycle-controls:
    name: Private facade lifecycle controls
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The private facade's joined lifecycle and fatal failure controls,
      # kept as a job of their own named for what they run.
      - name: Check the private facade's joined lifecycle and fatal failure controls
        run: nix run --quiet .#facade-lifecycle-controls
  # #449: the demonstration's refusals on one existing registry, as parallel
  # parts; each part creates its own registry on its own node.
  cli-flags:
    name: Documented CLI flags and refusal controls
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 90
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #326: the flags documented for `singular` — the settings table of
      # docs/singular-node.md and every documented invocation — are the
      # flags the binary's --help and each command's --help print, pair
      # by pair. The controls plant a flag on each side and show the check
      # refuses each disagreement by name.
      - name: Documented singular flags equal its --help
        run: nix run --quiet .#cli-flags-check
      - name: The flags check refuses each disagreement by name
        run: nix run --quiet .#cli-flags-controls
      # #638: the wallet vault promises of the packaged binary, through a
      # passphrase descriptor with no `cardano-cli` on the path — each
      # control planted-defect falsified, then green on the real binary.
      # Every run command the control starts is bounded in wall clock and
      # memory-capped where the runner provides a user manager.
      - name: The packaged wallet vault keeps its promises
        timeout-minutes: 20
        run: nix run --quiet .#wallet-vault-controls
  no-pin-registration-journey:
    name: No-pin registration, update, termination and reading through the packaged commands
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #742: one development network funds four wallets. The release's packaged
      # singular and open-datum create a registry, book three keys, fold one
      # (by a second wallet that holds nothing of the booker's), take one back
      # inside its window and clean one up after it (by a wallet that is not
      # the refund address), then create a second registry and one made by
      # singular, which publish no script. Every verdict is read from the
      # network's own record of the chain, never from a command's receipt, and
      # each assertion is shown failing on altered input. The verdict table and
      # the creation measurement are uploaded whatever the outcome.
      # The live holding also continues through a controller-signed update
      # and termination booking. A fresh process directory of the second
      # wallet folds from public data; the deposit donation and the folder's
      # whole-request allocation are read from transaction bytes and outputs.
      - name: Run registration, update, termination and reading against a development network
        run: |
          printf 'NO_PIN_JOURNEY_RESULTS=%s\n' "$RUNNER_TEMP/no-pin-journey-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # Includes insert bundle -> wallet sign -> submit, confirmed by the chain.
          NO_PIN_JOURNEY_RESULTS="$RUNNER_TEMP/no-pin-journey-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" nix run --quiet .#no-pin-registration-journey
      - name: Preserve the journey's verdicts, measurement and receipts
        if: always() && env.NO_PIN_JOURNEY_RESULTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: no-pin-registration-journey
          path: ${{ env.NO_PIN_JOURNEY_RESULTS }}
          if-no-files-found: error
  no-pin-registration-refusals:
    name: No-pin registration and reading refusals on a development network
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #742: one development network, one registry. Each wrong fold is the
      # honest fold of a booked registration with a single fact changed (no
      # approval, a token delivered elsewhere or with less than the deposit,
      # a second registration of an active key, an extra token in the state
      # output, a parked token presented as the registry state), submitted
      # to the node, which refuses it by the failure of a validator's own
      # script. Beside each refusal runs a control: the same fold with that
      # fact restored, which the node accepts and the chain records. The
      # verdict table and the receipt are uploaded whatever the outcome.
      - name: Check reading refusals and submit wrong folds to a development network
        run: |
          printf 'NO_PIN_REFUSALS_RESULTS=%s\n' "$RUNNER_TEMP/no-pin-refusals-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          NO_PIN_REFUSALS_RESULTS="$RUNNER_TEMP/no-pin-refusals-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" nix run --quiet .#no-pin-registration-refusals
      - name: Preserve the refusals' verdicts, receipt and answers
        if: always() && env.NO_PIN_REFUSALS_RESULTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: no-pin-registration-refusals
          path: ${{ env.NO_PIN_REFUSALS_RESULTS }}
          if-no-files-found: error
  no-pin-termination-refusals:
    name: No-pin termination refusals on a development network
    needs: blueprint
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Submit malformed terminations beside their packaged passing controls
        run: |
          printf 'NO_PIN_TERMINATION_REFUSALS_RESULTS=%s\n' "$RUNNER_TEMP/no-pin-termination-refusals-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          NO_PIN_TERMINATION_REFUSALS_RESULTS="$RUNNER_TEMP/no-pin-termination-refusals-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" nix run --quiet .#no-pin-termination-refusals
      - name: Preserve the refusals, chain observations and controls
        if: always() && env.NO_PIN_TERMINATION_REFUSALS_RESULTS != ''
        uses: actions/upload-artifact@v7
        with:
          name: no-pin-termination-refusals
          path: ${{ env.NO_PIN_TERMINATION_REFUSALS_RESULTS }}
          if-no-files-found: error
