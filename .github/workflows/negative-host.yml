# Negative host gates (#358, first slice).
#
# The host and its stranger-update pair from the release archive, the
# ordinary-executables and lint checks, the node-free parser,
# dispatch and handler controls that no other job runs, and the mutant
# self-check (negative-host-mutant-self-check) over the registry mutant's
# pairs. Every command below is a Nix app defined in nix/negative-host.nix;
# no step runs cabal, python or shell directly. Each job name is what it runs.
name: Negative host
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'applications/open-datum/negative/**'
      - 'applications/open-datum/offchain/cabal.project'
      - 'applications/open-datum/offchain/flake.nix'
      - 'applications/open-datum/offchain/flake.lock'
      - 'applications/open-datum/offchain/nix/**'
      - 'applications/open-datum/offchain/open-datum.cabal'
      - 'offchain/cabal.project'
      - 'offchain/flake.nix'
      - 'offchain/flake.lock'
      - 'nix/negative-host.nix'
      - 'onchain/validators/**'
      - 'tools/negative_host_*.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/negative-host.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: negative-host-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  negative-host-parts:
    name: Negative host pair parts
    runs-on: nixos
    timeout-minutes: 15
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Discover every pair part from the host table
        id: parts
        run: printf 'parts=%s\n' "$(nix run --quiet .#negative-host-parts)" >> "$GITHUB_OUTPUT"
  negative-host-part:
    name: "Negative host pair from the release archive: ${{ matrix.part }}"
    needs: [negative-host-parts]
    runs-on: nixos
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.negative-host-parts.outputs.parts).part }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run the selected pair from the release archive
        run: nix run --quiet .#negative-host-part -- '${{ matrix.part }}'
  negative-host-mutant-list:
    name: Negative host mutant list
    runs-on: nixos
    timeout-minutes: 15
    outputs:
      mutants: ${{ steps.mutants.outputs.mutants }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Discover every mutant from the host table
        id: mutants
        run: |
          mutants="$(nix run --quiet .#negative-host-mutants -- --list)"
          printf 'mutants=%s\n' "$mutants" >> "$GITHUB_OUTPUT"
  negative-host-mutant:
    name: "Negative host mutant: ${{ matrix.mutant }}"
    needs: [negative-host-mutant-list]
    runs-on: nixos
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mutant: ${{ fromJSON(needs.negative-host-mutant-list.outputs.mutants).mutant }}
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run the pairs the mutant refuses
        run: nix run --quiet .#negative-host-mutants -- '${{ matrix.mutant }}'
  negative-host-ordinary:
    name: Ordinary executables cannot reach the bypass
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check ordinary executables cannot reach the bypass
        run: nix run --quiet .#negative-host-ordinary
  negative-host-lint:
    name: "Negative host sources: format and lint"
    runs-on: nixos
    timeout-minutes: 20
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Format and lint the host sources
        run: nix run --quiet .#negative-host-lint
  negative-host-node-free-controls:
    name: Negative host parser, dispatch and handler controls
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # #562: the node-free legs of the retired negative host proof
      # script. The app builds the host binary as setup (exit 2 on
      # failure, never a verdict), then carries the membership of
      # the discovered parts, the empty-list refusal control on the
      # discovery assertion, the four exit-2 parser refusals, the
      # unknown-part refusal of the part dispatcher, and the terminate
      # and insert handler receipts with exit 10 against an unreachable
      # provider. The host build, plain discovery, the ordinary check and
      # the lint check keep their sole carriers in this workflow's other
      # jobs; the whole composite is not re-run beside them. Five minutes
      # from the measured 48 seconds plus the setup build.
      - name: Run the node-free parser, dispatch and handler controls
        run: nix run --quiet .#negative-host-node-free-controls
  negative-host-mutant-self-check:
    name: Negative host mutant self-check
    runs-on: nixos
    timeout-minutes: 45
    steps:
      - name: Reuse this runner's Nix cache
        run: |
          cache_dir="$HOME/.cache/singular-ci-nix"
          mkdir -p "$cache_dir"
          printf 'XDG_CACHE_HOME=%s\n' "$cache_dir" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run the mutant self-check over the registry mutant
        run: nix run --quiet .#negative-host-mutants -- --control-noop registry-accepts-a-taken-key
  negative-host-pairs:
    name: Negative host pairs
    needs: [negative-host-parts, negative-host-part]
    if: ${{ !cancelled() }}
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Every pair part passed
        env:
          PARTS: ${{ needs.negative-host-parts.result }}
          PART: ${{ needs.negative-host-part.result }}
        run: |
          echo "Negative host pair parts: $PARTS, part: $PART"
          [ "$PARTS" = success ] && [ "$PART" = success ]
  negative-host-mutants:
    name: Negative host mutants
    needs: [negative-host-mutant-list, negative-host-mutant]
    if: ${{ !cancelled() }}
    runs-on: nixos
    timeout-minutes: 5
    steps:
      - name: Every mutant passed
        env:
          MUTANTS: ${{ needs.negative-host-mutant-list.result }}
          MUTANT: ${{ needs.negative-host-mutant.result }}
        run: |
          echo "Negative host mutant list: $MUTANTS, mutant: $MUTANT"
          [ "$MUTANTS" = success ] && [ "$MUTANT" = success ]
