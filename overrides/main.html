{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  {% if page %}<link rel="speech" href="{{ (page.file.src_uri | replace('.md', '.speech.json')) | url }}">{% endif %}
  <link id="singular-dark-palette" href="{{ 'css/palettes/dark.css' | url }}" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link href="{{ 'assets/singular.css' | url }}" rel="stylesheet">
  <script src="{{ 'assets/palette.js' | url }}"></script>
{% endblock %}
{% block side_panel %}
<aside id="terminal-mkdocs-side-panel">
  <details id="singular-navigation">
    <summary>Contents</summary>
    {% include "partials/side-nav/side-nav.html" %}
    {% include "partials/side-panel/side-toc.html" %}
  </details>
</aside>
{% endblock %}
{% block footer %}
  {{ super() }}
  <script src="{{ 'assets/mermaid-init.js' | url }}"></script>
{% endblock %}
