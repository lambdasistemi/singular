site_name: Singular
site_description: A permissionless registry on Cardano for unique identities and independent application state.
site_url: https://lambdasistemi.github.io/singular/
repo_url: https://github.com/lambdasistemi/singular
repo_name: lambdasistemi/singular
docs_dir: .docs-source
exclude_docs: |
  docs/audio/manifest.json
site_dir: site
nav:
  - Home: index.md
  - Dated demos:
      - Index: docs/demos/index.md
      - 23 October — Maintain and recover a name: docs/demos/d02-naming.md
      - 30 October — Name Your Address stretch: docs/demos/d03-escrow.md
  - Original design:
      - Responsibilities and terminology: docs/overview.md
      - Lifecycle and custody: docs/lifecycle.md
      - Certification: docs/certification.md
  - Naming walkthrough: docs/naming-demo.md
  - Naming lifecycle: docs/naming-lifecycle.md
  - Ending a name: docs/retirement.md
  - Recovery and retirement: docs/recovery-retirement.md
  - Keep recovery and retirement available: docs/record-value.md
  - Run with your own provider and wallet: docs/consumer-onboarding.md
  - Connecting singular to a ledger provider: docs/singular-node.md
  - Download and verify a release: docs/verify-release.md
  - Conformance evidence: docs/conformance-evidence.md
  - Consumer conformance record: docs/consumer-conformance.md
  - The preprod record: docs/preprod.md
  - Demo 1 on preprod, what a reviewer checks: docs/demo1-preprod.md
  - Executable candidate:
      - Review guide: docs/design.md
      - Play the simulation: docs/simulation.md
      - First demo, registry handoff on preprod: docs/first-demo.md
      - Decisions and abstractions: docs/decisions.md
      - Model coverage: docs/model-ledger.md
      - Theorem statements: docs/theorems.md
      - Mutation ledger: docs/mutants.md
      - Lean clarity: docs/LEAN-CLARITY.md
  - Prior art: docs/prior-art.md
  - Protocol specification: specs/protocol/spec.md
  - Building the documentation: docs/building.md
  - Checking off-chain code: docs/offchain-development.md
  - Select tests for a change: docs/test-selection.md
  - Builder and blueprint modules: docs/offchain-builder-blueprint.md
  - Who owns a registry fold: docs/offchain-fold-responsibilities.md
  - Who owns the registry wire: docs/offchain-wire-types.md
  - Node module ownership: docs/offchain-node-ownership.md
  - Deployment record ownership: docs/offchain-deployment-owners.md
  - Registry command owners: docs/offchain-command-entrypoints.md
  - The Koios client: docs/offchain-koios-client.md
  - Recovering a registry command: docs/cli-recovery.md
  - State validator owners: docs/onchain-validator-owners.md
  - Validator API reference: docs/onchain-api-reference.md
  - Off-chain API reference: docs/offchain-api-reference.md
  - Conformance API reference: docs/conformance-api-reference.md
  - Conformance suite owners: docs/conformance-architecture.md
theme:
  name: terminal
  custom_dir: overrides
  palette: default
  features:
    - footer.prev_next
    - navigation.top.cursor_animation.hide
hooks:
  - tools/mkdocs_api_overlay.py
plugins:
  - search
  - asciinema-player
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - assets/mermaid.min.js
validation:
  links:
    not_found: warn
    anchors: warn
